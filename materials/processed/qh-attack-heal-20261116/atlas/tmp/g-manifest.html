<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Figure preview</title><style>
/* Figures of the reader. One figure answers the question of its section: a quiet head (the title and the links to
   the chapter's equations), the record's domain and controls beside the drawing in the golden proportion
   (1 : 1.618) when the figure is wide enough, and the authored caption under it. Layout follows the figure's own
   width (a container), so a figure set in the reading column stacks rather than shrinking its labels.

   Every mark keeps one meaning. Ink is a defined map, a curve or a label. The accent marks what the reader's
   choice changes or singles out: the mean, the chosen region, the pole, the surviving basis vectors, the nonzero
   entries, the unit. No dashed line is used: dashes are reserved for open comparisons. The page's tokens give
   colour, type and rhythm. */
.qh-fig { container-type: inline-size; margin: calc(var(--text-base) * 1.55 * 1.5) 0; padding: calc(var(--text-base) * 1.55 * .5) 0 0;
          border-top: 1px solid var(--rule); --fig-au: calc(var(--text-base) * 1.55); }
/* Inside a figure the host page's paragraph rules do not apply: no first-line indent and no justification. These
   selectors outrank a host's `p` and `p + p` rules whatever the order of the stylesheets, and the figure's own
   spacing rules below are scoped to .qh-fig for the same reason. */
figure.qh-fig p, figure.qh-fig p + p { text-indent: 0; text-align: left; }
.qh-fig-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: calc(var(--fig-au) * .25) 16px;
               margin: 0 0 calc(var(--fig-au) * .5); }
.qh-fig-title { margin: 0; font-size: calc(var(--text-base) * 1.08); font-weight: 600; line-height: 1.28; }
.qh-fig-refs { margin: 0; font-size: var(--text-xs); color: var(--ink-3); }
.qh-fig-refs a { color: var(--ink-2); }
.qh-fig .qh-fig-label { margin: 0 0 calc(var(--fig-au) * .25); font-size: var(--text-xs); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
                font-weight: 400; text-align: left; }
.qh-fig-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: calc(var(--fig-au) * .75) 28px; align-items: start; }
@container (min-width: 40rem) { .qh-fig-body:not(.qh-fig-body-single) { grid-template-columns: minmax(0, 1fr) minmax(0, 1.618fr); } }
.qh-fig-body-single { gap: calc(var(--fig-au) * .6); }
.qh-fig-side, .qh-fig-stage { min-width: 0; }
.qh-fig-stage { container-type: inline-size; }
.qh-fig-domain { margin: 0; font-size: var(--text-sm); line-height: 1.45; color: var(--ink-2); max-width: var(--measure); }
.qh-fig-side .qh-fig-domain { margin-bottom: calc(var(--fig-au) * .5); }
.qh-fig .qh-fig-note { margin: 2px 0 0; font-size: var(--text-xs); line-height: 1.45; color: var(--ink-3); font-style: italic; }
.qh-fig .qh-fig-explanation { display: block; margin: 4px 0 0; font-size: var(--text-sm); line-height: 1.45; color: var(--ink-2); }
.qh-fig-strong { font-weight: 600; color: var(--ink); }

/* Controls: an authored label, the current value, the range input (added by the script) */
.qh-fig-controls { list-style: none; margin: 0 0 calc(var(--fig-au) * .5); padding: 0; display: grid; grid-template-columns: minmax(0, 1fr);
                   gap: calc(var(--fig-au) * .25); }
.qh-fig-control { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; column-gap: 12px; }
.qh-fig-control-label { font-size: var(--text-sm); color: var(--ink-2); line-height: 1.35; }
.qh-fig-control input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 2px 0 0; accent-color: var(--accent); }
.qh-fig-value { font-variant-numeric: lining-nums tabular-nums; color: var(--ink); }
.qh-fig .qh-fig-invalid { margin: calc(var(--fig-au) * .25) 0 0; padding: calc(var(--fig-au) * .25) 10px; border-left: 2px solid var(--accent);
                  background: var(--accent-soft); font-size: var(--text-xs); line-height: 1.45; color: var(--ink); }
.qh-fig-invalid[hidden] { display: none; }
.qh-fig button:focus-visible, .qh-fig input:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }

/* Drawings: SVG at its natural size or smaller, never enlarged, so labels keep the size they were set at */
.qh-fig-svg { display: block; width: 100%; height: auto; overflow: visible; font-family: var(--font-text); }
.qh-fig-svg text { fill: var(--ink); }
.qh-fig-tick { font-family: var(--font-ui); font-size: 12px; fill: var(--ink-3) !important; font-variant-numeric: lining-nums tabular-nums; }
.qh-fig-var { font-style: italic; font-family: var(--font-text); font-size: 14px; }
.qh-fig-axis { fill: none; stroke: var(--ink-4); stroke-width: 1; }
.qh-fig-more { fill: var(--ink-4); stroke: none; }
.qh-fig-map { fill: none; stroke: var(--ink-2); stroke-width: 1.35; }
.qh-fig-head-mark { fill: var(--ink-2); }
.qh-fig-map-label { font-size: 14px; font-style: italic; fill: var(--ink-2) !important; paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.qh-fig-mark-label { font-size: 13px; fill: var(--ink-2) !important; paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.qh-fig-node-text { font-size: 17px; font-style: italic; }
.qh-fig-sub { font-size: .74em; }

/* Profiles: one curve per authored function over a finite window of its variable; the real-line integral is the
   authored formula, written under the curve (no area is filled, so a window never reads as the whole mass). */
.qh-fig-profiles { display: grid; grid-template-columns: minmax(0, 1fr); gap: calc(var(--fig-au) * .6) 20px; }
@container (min-width: 50rem) { .qh-fig-profiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.qh-fig-profile { min-width: 0; max-width: 26rem; }
.qh-fig-profile .qh-fig-svg { max-width: 360px; }
.qh-fig .qh-fig-profile-label { margin: 0 0 2px; font-size: var(--text-sm); font-weight: 600; line-height: 1.3; }
.qh-fig .qh-fig-integral { margin: 4px 0 0; }
.qh-fig .qh-fig-integral .qh-fig-label { margin: 0; }
.qh-fig .qh-fig-integral-value { margin: 0; font-size: var(--text-sm); line-height: 1.45; color: var(--ink); }
.qh-fig .qh-fig-profile-caption { margin: 2px 0 0; font-size: var(--text-xs); line-height: 1.45; color: var(--ink-3); }
.qh-fig-curve { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
.qh-fig-mean { stroke: var(--accent); stroke-width: 1.4; }

/* Values at the current parameters, and tables of parallel facts */
.qh-fig-outputs { width: 100%; margin: calc(var(--fig-au) * .75) 0 0; border-collapse: collapse; font-size: var(--text-sm); line-height: 1.35; }
.qh-fig-outputs caption { caption-side: top; }
.qh-fig-outputs th, .qh-fig-outputs td { padding: calc(var(--fig-au) * .25) 8px; border-top: 1px solid var(--rule-soft); vertical-align: top;
                                         text-align: left; font-weight: 400; }
.qh-fig-outputs thead th { font-size: var(--text-xs); color: var(--ink-3); border-top: 0; vertical-align: bottom; }
.qh-fig-outputs tbody th { color: var(--ink-2); width: 34%; }
.qh-fig-num { text-align: right !important; width: 5.5em; }
.qh-fig-formula { overflow-x: auto; }

/* States: the authored cases; the chosen one carries the accent rule */
.qh-fig-states { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: calc(var(--fig-au) * .5); }
.qh-fig-state { min-width: 0; padding: calc(var(--fig-au) * .25) 0 calc(var(--fig-au) * .25) 12px; border-left: 2px solid var(--rule-soft); }
.qh-fig-state[aria-current="true"] { border-left-color: var(--accent); }
.qh-fig-live .qh-fig-state:not([aria-current="true"]) .qh-fig-series { color: var(--ink-3); }
.qh-fig-live .qh-fig-states-compact { gap: calc(var(--fig-au) * .25); }
.qh-fig-live .qh-fig-state:not([aria-current="true"]) .qh-fig-per-state { display: none; }
.qh-fig-state-label { margin: 0; font-size: var(--text-sm); font-weight: 600; }
.qh-fig .qh-fig-cond { margin: 2px 0 0; font-size: var(--text-sm); color: var(--ink-2); }
.qh-fig-series { margin: calc(var(--fig-au) * .25) 0 0; overflow-x: auto; }
.qh-fig-series .qh-fig-label { margin: 0; }
.qh-fig-per-state { margin-top: 4px; }
.qh-fig .qh-fig-matrix { margin: 4px 0; overflow-x: auto; }
.qh-fig .qh-fig-homotopy { margin: 4px 0 0; font-size: var(--text-sm); line-height: 1.45; color: var(--ink-2); }
.qh-fig-homotopy .qh-fig-label { display: block; margin: 0; }
.qh-fig-choose, .qh-fig-key-button { font: inherit; color: inherit; background: none; border: 1px solid var(--rule); border-radius: 999px;
                                     padding: 3px 12px; cursor: pointer; text-align: left; }
.qh-fig-choose:hover, .qh-fig-key-button:hover { border-color: var(--ink-4); }
.qh-fig-choose[aria-pressed="true"], .qh-fig-key-button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft);
                                                                               box-shadow: inset 0 0 0 1px var(--accent); }

/* Two expansion domains in the w-plane at a fixed z */
.qh-fig-plane { max-width: 360px; }
.qh-fig-region { fill: var(--accent-soft); }
.qh-fig-boundary { fill: none; stroke: var(--ink-3); stroke-width: 1.1; }
.qh-fig-origin { fill: var(--ink-3); }
.qh-fig-region-label { font-size: 15px; font-style: italic; fill: var(--ink) !important; }
.qh-fig-pole circle { fill: var(--paper-3); stroke: var(--accent); stroke-width: 1.6; }
.qh-fig-pole path { stroke: var(--accent); stroke-width: 1.6; }

/* The cohomology jump: the complex on its basis; rings mark the vectors that survive in cohomology, here and in
   the table */
.qh-fig-complex { max-width: 460px; }
.qh-fig-col-label { font-size: 14px; fill: var(--ink-2) !important; }
.qh-fig-zero { font-size: 17px; fill: var(--ink-2) !important; }
.qh-fig-ring { fill: var(--paper-3); stroke: var(--ink-4); stroke-width: 1; transition: fill .2s, stroke .2s; }
.qh-fig-basis.is-alive .qh-fig-ring { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.qh-fig-homotopy-arc { fill: none; stroke: var(--ink-3); stroke-width: 1.1; }
.qh-fig-head-h { fill: var(--ink-3); }
.qh-fig-h-label { font-size: 13.5px; font-style: italic; fill: var(--ink-2) !important; paint-order: stroke; stroke: var(--paper); stroke-width: 4px; }
.qh-fig-dims td { white-space: nowrap; }
.qh-fig-dims tbody tr[aria-current="true"] > * { background: var(--accent-soft); }
.qh-fig-dims tbody tr[aria-current="true"] th { color: var(--ink); font-weight: 600; }
.qh-fig-dim { display: inline-block; min-width: 1.2em; font-variant-numeric: lining-nums tabular-nums; }
.qh-fig-chip { display: inline-block; margin: 0 0 0 4px; padding: 0 6px; border: 1.5px solid var(--accent); border-radius: 999px;
               background: var(--accent-soft); font-style: italic; font-size: .92em; line-height: 1.4; }

/* The infinite rank: the finite diagonal beside its coordinatewise limit, in one viewport */
.qh-fig-pair { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: calc(var(--fig-au) * .75) 32px; }
@container (min-width: 34rem) { .qh-fig-pair { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.qh-fig-col { min-width: 0; }
.qh-fig .qh-fig-col-head { margin: 0 0 4px; font-size: var(--text-sm); font-weight: 600; line-height: 1.3; }
.qh-fig-col .qh-fig-control { margin: 0 0 6px; max-width: 280px; }
.qh-fig-grid { max-width: 260px; }
.qh-fig-cell rect { fill: var(--paper-3); stroke: var(--rule-soft); stroke-width: 1; transition: fill .15s, stroke .15s; }
.qh-fig-cell text { font-family: var(--font-ui); font-size: 12px; fill: var(--ink-4) !important; font-variant-numeric: lining-nums tabular-nums; }
.qh-fig-cell.is-on rect { fill: var(--accent-soft); stroke: var(--accent); }
.qh-fig-cell.is-on text { fill: var(--ink) !important; font-weight: 600; font-size: 13px; }
.qh-fig-bracket { fill: none; stroke: var(--ink-3); stroke-width: 1.2; }
.qh-fig-continues { font-size: 17px; fill: var(--ink-4) !important; }
.qh-fig-continues.is-on { fill: var(--accent) !important; }
.qh-fig-convergence { margin: 0; font-size: var(--text-base); line-height: 1.5; color: var(--ink); max-width: var(--measure); }
.qh-fig-compare td, .qh-fig-compare th[scope="col"] { width: 33%; }

/* The adjunction triangles: the key, the two triangles side by side, the criteria */
.qh-fig-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: var(--text-sm); color: var(--ink-2); }
.qh-fig-key { display: inline-flex; align-items: center; gap: 8px; }
.qh-fig-key-button { display: inline-flex; align-items: center; gap: 8px; }
.qh-fig-swatch { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--ink-2); }
.qh-fig-key.is-unit .qh-fig-swatch { border-top-color: var(--accent); }
.qh-fig-key.is-counit .qh-fig-swatch { border-top-color: var(--ink); border-top-width: 2.5px; }
.qh-fig-sym.is-unit { color: var(--accent); }
.qh-fig-triangle { max-width: 320px; }
.qh-fig-arrow .qh-fig-map { stroke: var(--ink-3); stroke-width: 1.2; }
.qh-fig-arrow.is-unit .qh-fig-map { stroke: var(--accent); stroke-width: 1.7; }
.qh-fig-arrow.is-counit .qh-fig-map { stroke: var(--ink); stroke-width: 1.7; }
.qh-fig-head-mark.is-unit { fill: var(--accent); }
.qh-fig-head-mark.is-counit { fill: var(--ink); }
.qh-fig-arrow.is-unit .qh-fig-map-label { fill: var(--accent) !important; }
.qh-fig-arrow.is-counit .qh-fig-map-label { fill: var(--ink) !important; }
.qh-fig-arrow { transition: opacity .2s; }
.qh-fig[data-emphasis="unit"] .qh-fig-arrow:not(.is-unit), .qh-fig[data-emphasis="counit"] .qh-fig-arrow:not(.is-counit) { opacity: .25; }
.qh-fig .qh-fig-equation { margin: 6px 0 0; font-size: var(--text-base); font-style: italic; color: var(--ink); }
.qh-fig-properties td { width: 50%; }

.qh-fig-caption { margin: calc(var(--fig-au) * .75) 0 0; max-width: var(--measure); font-size: var(--text-sm); line-height: 1.5; color: var(--ink-2); }

@media (prefers-reduced-motion: reduce) {
  .qh-fig-ring, .qh-fig-cell rect, .qh-fig-arrow { transition: none; }
}
@media print {
  .qh-fig { break-inside: avoid; page-break-inside: avoid; }
  .qh-fig input[type="range"], .qh-fig-invalid { display: none !important; }
  .qh-fig-live .qh-fig-state .qh-fig-per-state { display: block !important; }
  .qh-fig-choose, .qh-fig-key-button { border: 0; padding: 0; background: none; box-shadow: none; }
  .qh-fig-region, .qh-fig-basis.is-alive .qh-fig-ring, .qh-fig-cell.is-on rect, .qh-fig-chip, .qh-fig-dims tbody tr[aria-current="true"] > * {
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .qh-fig .qh-fig-arrow { opacity: 1 !important; }
}
@media (forced-colors: active) {
  .qh-fig-mean, .qh-fig-pole circle, .qh-fig-pole path, .qh-fig-arrow.is-unit .qh-fig-map { stroke: Highlight; }
  .qh-fig-region { fill: Canvas; stroke: Highlight; }
  .qh-fig-basis.is-alive .qh-fig-ring, .qh-fig-cell.is-on rect { fill: Canvas; stroke: Highlight; stroke-width: 2.5; }
  .qh-fig-head-mark, .qh-fig-head-mark.is-unit, .qh-fig-head-mark.is-counit { fill: CanvasText; }
  .qh-fig-chip { border-color: Highlight; }
}

<figure class="qh-fig" id="fig-adjunction-triangles" data-figure="fig-adjunction-triangles" data-qh-figure="fig-adjunction-triangles" data-figure-type="authored_diagram" data-figure-model="adjunction-triangles" data-figure-chapter="ch06" data-figure-section="adjunction-comparison-maps" data-config="{&quot;model&quot;:&quot;adjunction-triangles&quot;,&quot;initial&quot;:&quot;left-triangle&quot;,&quot;states&quot;:[&quot;left-triangle&quot;,&quot;right-triangle&quot;]}"><div class="qh-fig-head"><p class="qh-fig-title" data-block-title>The two triangle identities of an adjunction</p></div><div class="qh-fig-body qh-fig-body-single"><ul class="qh-fig-legend"><li class="qh-fig-key" data-key="F"><span class="qh-fig-key-text">Left adjoint F</span></li><li class="qh-fig-key" data-key="G"><span class="qh-fig-key-text">Right adjoint G</span></li><li class="qh-fig-key is-unit" data-key="eta"><span class="qh-fig-swatch" aria-hidden="true"></span><span class="qh-fig-key-text">Unit <span class="qh-fig-sym is-unit">η</span>: id<sub>C</sub> → GF</span></li><li class="qh-fig-key is-counit" data-key="epsilon"><span class="qh-fig-swatch" aria-hidden="true"></span><span class="qh-fig-key-text">Counit <span class="qh-fig-sym is-counit">ε</span>: FG → id<sub>D</sub></span></li></ul><p class="qh-fig-domain">Categories C and D with an adjunction F:C→D, G:D→C. X belongs to C and Y belongs to D. The chapter writes Φ and Ψ for its particular F and G.</p><ol class="qh-fig-pair qh-fig-triangles"><li class="qh-fig-col" data-state="left-triangle"><p class="qh-fig-col-head">Triangle at FX</p><svg class="qh-fig-svg qh-fig-triangle" viewBox="0 0 300 196" role="img" aria-label="ε_FX ∘ F(η_X) = id_FX"><defs><marker id="fig-adjunction-triangles--left-triangle--arrow" viewBox="0 0 8 8" refX="7.4" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.6 7.6 4 0 7.4z" class="qh-fig-head-mark"/></marker><marker id="fig-adjunction-triangles--left-triangle--unit" viewBox="0 0 8 8" refX="7.4" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.6 7.6 4 0 7.4z" class="qh-fig-head-mark is-unit"/></marker><marker id="fig-adjunction-triangles--left-triangle--counit" viewBox="0 0 8 8" refX="7.4" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.6 7.6 4 0 7.4z" class="qh-fig-head-mark is-counit"/></marker></defs><g class="qh-fig-arrow is-unit"><path class="qh-fig-map" d="M54.1 145.0L137.9 53.2" marker-end="url(#fig-adjunction-triangles--left-triangle--unit)"/><text class="qh-fig-map-label" x="86.4" y="90.3" text-anchor="end">F(η<tspan class="qh-fig-sub" dy="4">X</tspan><tspan dy="-4">)</tspan></text></g><g class="qh-fig-arrow is-counit"><path class="qh-fig-map" d="M160.1 51.0L243.9 142.8" marker-end="url(#fig-adjunction-triangles--left-triangle--counit)"/><text class="qh-fig-map-label" x="211.6" y="88.1" text-anchor="start">ε<tspan class="qh-fig-sub" dy="4">FX</tspan></text></g><g class="qh-fig-arrow"><path class="qh-fig-map" d="M62.2 156.0L234.8 156.0" marker-end="url(#fig-adjunction-triangles--left-triangle--arrow)"/><text class="qh-fig-map-label" x="148.5" y="183.0" text-anchor="middle">id<tspan class="qh-fig-sub" dy="4">FX</tspan></text></g><text class="qh-fig-node-text" x="44" y="161" text-anchor="middle">FX</text><text class="qh-fig-node-text" x="150" y="45" text-anchor="middle">FGFX</text><text class="qh-fig-node-text" x="256" y="161" text-anchor="middle">FX</text></svg><p class="qh-fig-equation"><span class="qh-fig-sym is-counit">ε</span><sub>FX</sub> ∘ F(<span class="qh-fig-sym is-unit">η</span><sub>X</sub>) = id<sub>FX</sub></p><p class="qh-fig-explanation">Applying F to the unit and then evaluating by the counit recovers the original object FX.</p></li><li class="qh-fig-col" data-state="right-triangle"><p class="qh-fig-col-head">Triangle at GY</p><svg class="qh-fig-svg qh-fig-triangle" viewBox="0 0 300 196" role="img" aria-label="G(ε_Y) ∘ η_GY = id_GY"><defs><marker id="fig-adjunction-triangles--right-triangle--arrow" viewBox="0 0 8 8" refX="7.4" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.6 7.6 4 0 7.4z" class="qh-fig-head-mark"/></marker><marker id="fig-adjunction-triangles--right-triangle--unit" viewBox="0 0 8 8" refX="7.4" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.6 7.6 4 0 7.4z" class="qh-fig-head-mark is-unit"/></marker><marker id="fig-adjunction-triangles--right-triangle--counit" viewBox="0 0 8 8" refX="7.4" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.6 7.6 4 0 7.4z" class="qh-fig-head-mark is-counit"/></marker></defs><g class="qh-fig-arrow is-unit"><path class="qh-fig-map" d="M54.1 145.0L137.9 53.2" marker-end="url(#fig-adjunction-triangles--right-triangle--unit)"/><text class="qh-fig-map-label" x="86.4" y="90.3" text-anchor="end">η<tspan class="qh-fig-sub" dy="4">GY</tspan></text></g><g class="qh-fig-arrow is-counit"><path class="qh-fig-map" d="M160.1 51.0L243.9 142.8" marker-end="url(#fig-adjunction-triangles--right-triangle--counit)"/><text class="qh-fig-map-label" x="211.6" y="88.1" text-anchor="start">G(ε<tspan class="qh-fig-sub" dy="4">Y</tspan><tspan dy="-4">)</tspan></text></g><g class="qh-fig-arrow"><path class="qh-fig-map" d="M62.2 156.0L234.8 156.0" marker-end="url(#fig-adjunction-triangles--right-triangle--arrow)"/><text class="qh-fig-map-label" x="148.5" y="183.0" text-anchor="middle">id<tspan class="qh-fig-sub" dy="4">GY</tspan></text></g><text class="qh-fig-node-text" x="44" y="161" text-anchor="middle">GY</text><text class="qh-fig-node-text" x="150" y="45" text-anchor="middle">GFGY</text><text class="qh-fig-node-text" x="256" y="161" text-anchor="middle">GY</text></svg><p class="qh-fig-equation">G(<span class="qh-fig-sym is-counit">ε</span><sub>Y</sub>) ∘ <span class="qh-fig-sym is-unit">η</span><sub>GY</sub> = id<sub>GY</sub></p><p class="qh-fig-explanation">Applying the unit and then G to the counit recovers the original object GY.</p></li></ol><table class="qh-fig-outputs qh-fig-properties"><thead><tr><th scope="col">Hypothesis</th><th scope="col">Equivalent statement</th></tr></thead><tbody><tr><td>Every component <span class="qh-fig-sym is-unit">η</span><sub>X</sub> is an isomorphism.</td><td><span class="qh-fig-strong">F is fully faithful.</span><span class="qh-fig-explanation">For every pair X,X′, F induces a bijection on their morphism sets.</span></td></tr><tr><td>Every component <span class="qh-fig-sym is-counit">ε</span><sub>Y</sub> is an isomorphism.</td><td><span class="qh-fig-strong">G is fully faithful.</span><span class="qh-fig-explanation">For every pair Y,Y′, G induces a bijection on their morphism sets.</span></td></tr><tr><td>Both <span class="qh-fig-sym is-unit">η</span> and <span class="qh-fig-sym is-counit">ε</span> are natural isomorphisms.</td><td><span class="qh-fig-strong">F and G give inverse equivalences of C and D.</span><span class="qh-fig-explanation">Both comparison maps are invertible on their entire displayed categories.</span></td></tr></tbody></table></div><figcaption class="qh-fig-caption">For F left adjoint to G, the unit η and counit ε satisfy two identities. These identities hold for every adjunction. Invertibility of the unit or counit is an additional property, with the consequences stated below.</figcaption></figure></main><script>/* Figures of the reader: controls for the author's figure records. The server draws each figure's initial state,
   which is complete without this script and in print. Every value shown is an authored formula evaluated at the
   current parameters, and every state is one the record lists.
   - Gaussian: one range input per permitted control, inside the authored display window. A proposed value that
     breaks the authored validity rule is refused; the authored message is shown and the previous valid values
     stay.
   - Expansions: a choice between the two authored regions.
   - Cohomology jump: a choice between the authored values of t; the drawing, the matrix and the table follow.
   - Infinite rank: the authored control N redraws the finite diagonal beside its limit.
   - Adjunction: the key's unit and counit entries, pressed, pick out the arrows built from them. */
(function () {
  'use strict';
  var doc = document;
  var NS = 'http://www.w3.org/2000/svg';
  function all(sel, root) { return Array.prototype.slice.call((root || doc).querySelectorAll(sel)); }
  var CONST = { pi: Math.PI };

  /* The authored formula evaluated at the parameters, as on the server: null where it has no number. */
  function val(n, env) {
    var k = n[0], a, b;
    if (k === 'num') return +n[1];
    if (k === 'var') return Object.prototype.hasOwnProperty.call(env, n[1]) ? env[n[1]] : (n[1] in CONST ? CONST[n[1]] : null);
    if (k === 'group') return val(n[1], env);
    if (k === 'abs' || k === 'neg') {
      a = val(n[1], env);
      if (a === null || typeof a === 'boolean') return null;
      return k === 'abs' ? Math.abs(a) : -a;
    }
    if (k === 'add' || k === 'sub' || k === 'mul' || k === 'div' || k === 'pow') {
      a = val(n[1], env); b = val(n[2], env);
      if (a === null || b === null || typeof a === 'boolean' || typeof b === 'boolean') return null;
      if (k === 'add') return a + b;
      if (k === 'sub') return a - b;
      if (k === 'mul') return a * b;
      if (k === 'div') return b === 0 ? null : a / b;
      return Math.pow(a, b);
    }
    if (k === 'call') {
      a = val(n[2], env);
      if (a === null || typeof a === 'boolean') return null;
      if (n[1] === 'sqrt') return a >= 0 ? Math.sqrt(a) : null;
      if (n[1] === 'exp') return a < 700 ? Math.exp(a) : null;
      return null;
    }
    if (k === 'cmp') {
      a = val(n[2], env); b = val(n[3], env);
      if (a === null || b === null) return null;
      return { '<': a < b, '>': a > b, '<=': a <= b, '>=': a >= b, '!=': a !== b, '==': a === b }[n[1]];
    }
    if (k === 'and') return val(n[1], env) === true && val(n[2], env) === true;
    return null;
  }
  function fmt(v) {
    if (v === null || v === undefined || typeof v === 'boolean' || !isFinite(v)) return '';
    if (v !== 0 && (Math.abs(v) >= 1000 || Math.abs(v) < 0.001)) return v.toPrecision(3);
    return v.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
  }
  function copy(o) { var r = {}; for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) r[k] = o[k]; return r; }
  function show(el, on) { if (!el) return; if (on) el.removeAttribute('display'); else el.setAttribute('display', 'none'); }

  /* A range input for an authored control, added to its list item after the label and the value. */
  function rangeFor(fig, li, name, c, value) {
    var input = doc.createElement('input');
    input.type = 'range';
    input.id = fig.id + '--' + name;
    input.min = String(c.min); input.max = String(c.max); input.step = String(c.step); input.value = String(value);
    input.setAttribute('aria-valuetext', fmt(value));
    li.appendChild(input);
    return input;
  }

  /* The authored states as buttons: each state's label becomes a button that chooses it. */
  function stateButtons(fig, choose) {
    all('.qh-fig-state[data-state]', fig).forEach(function (li) {
      var id = li.getAttribute('data-state'), label = li.querySelector('.qh-fig-state-label');
      if (!label) return;
      var b = doc.createElement('button');
      b.type = 'button';
      b.className = 'qh-fig-choose';
      while (label.firstChild) b.appendChild(label.firstChild);
      label.appendChild(b);
      b.addEventListener('click', function () { choose(id); });
    });
  }
  function markCurrent(fig, id) {
    all('.qh-fig-state[data-state]', fig).forEach(function (li) {
      var on = li.getAttribute('data-state') === id, b = li.querySelector('button.qh-fig-choose');
      if (on) li.setAttribute('aria-current', 'true'); else li.removeAttribute('aria-current');
      if (b) b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    all('[data-state-row]', fig).forEach(function (tr) {
      if (tr.getAttribute('data-state-row') === id) tr.setAttribute('aria-current', 'true'); else tr.removeAttribute('aria-current');
    });
  }

  function gaussian(fig, cfg) {
    var W = cfg.window[0], H = cfg.window[1], PAD = cfg.window[2], SPAN = cfg.window[3];
    var env = {};
    cfg.names.forEach(function (n) { env[n] = +cfg.controls[n].initial; });
    var note = fig.querySelector('.qh-fig-invalid');
    function wx(t) { return PAD + (t + SPAN) / (2 * SPAN) * (W - 2 * PAD); }
    function curve(p) {
      var scale = 1, i, t, v, pts = [], local = copy(env);
      if (p.density) {
        scale = 0;
        for (i = -160; i <= 160; i++) { local[p.variable] = i / 40; v = val(p.formula, local) || 0; if (v > scale) scale = v; }
        scale = scale || 1;
      }
      for (i = 0; i <= 160; i++) {
        t = -SPAN + 2 * SPAN * i / 160;
        local[p.variable] = t;
        v = val(p.formula, local);
        if (v === null || typeof v === 'boolean') v = 0;
        pts.push(wx(t).toFixed(1) + ' ' + (H - PAD - Math.min(v / scale, 1.06) * (H - 2 * PAD - 8)).toFixed(1));
      }
      return 'M' + pts.join(' L');
    }
    function update() {
      all('output[data-value]', fig).forEach(function (o) {
        var key = o.getAttribute('data-value'), v = null;
        if (key.indexOf('profile:') === 0) {
          cfg.profiles.forEach(function (p) { if ('profile:' + p.id === key) v = val(p.integral, env); });
        } else if (Object.prototype.hasOwnProperty.call(cfg.outputs, key)) v = val(cfg.outputs[key], env);
        else if (Object.prototype.hasOwnProperty.call(env, key)) v = env[key];
        o.textContent = fmt(v);
      });
      var mean = cfg.mean ? val(cfg.mean, env) : null;
      cfg.profiles.forEach(function (p) {
        var box = fig.querySelector('.qh-fig-profile[data-profile="' + p.id + '"] svg');
        if (!box) return;
        var c = box.querySelector('[data-part="curve"]');
        if (c) c.setAttribute('d', curve(p));
        var m = box.querySelector('[data-part="mean"]'), ml = box.querySelector('[data-part="mean-label"]');
        if (m && mean !== null) {
          var x = wx(Math.max(-SPAN, Math.min(SPAN, mean))), right = x > W / 2;
          m.setAttribute('x1', x.toFixed(1)); m.setAttribute('x2', x.toFixed(1));
          if (ml) { ml.setAttribute('x', (right ? x - 5 : x + 5).toFixed(1)); ml.setAttribute('text-anchor', right ? 'end' : 'start'); }
        }
      });
    }
    all('.qh-fig-control[data-param]', fig).forEach(function (li) {
      var n = li.getAttribute('data-param'), c = cfg.controls[n];
      if (!c) return;
      var input = rangeFor(fig, li, n, c, env[n]);
      input.addEventListener('input', function () {
        var trial = copy(env);
        trial[n] = +input.value;
        if (val(cfg.rule, trial) === true) {
          env = trial;
          if (note) note.hidden = true;
          input.setAttribute('aria-valuetext', fmt(env[n]));
          update();
        } else {
          input.value = String(env[n]); /* refused: the previous valid values stay, and the authored message says why */
          if (note) note.hidden = false;
        }
      });
    });
    fig.classList.add('qh-fig-live');
    update();
  }

  function expansions(fig, cfg) {
    var svg = fig.querySelector('.qh-fig-plane');
    var W = cfg.plane[0], H = cfg.plane[1], cx = cfg.plane[2], cy = cfg.plane[3], r = cfg.plane[4];
    function region(state) {
      var el;
      if (state.inside) {
        el = doc.createElementNS(NS, 'circle');
        el.setAttribute('cx', cx); el.setAttribute('cy', cy); el.setAttribute('r', r);
      } else {
        el = doc.createElementNS(NS, 'path');
        el.setAttribute('fill-rule', 'evenodd');
        el.setAttribute('d', 'M2 2H' + (W - 2) + 'V' + (H - 2) + 'H2Z M' + (cx + r) + ' ' + cy + 'a' + r + ' ' + r + ' 0 1 0 -' + (2 * r) +
                             ' 0a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0Z');
      }
      el.setAttribute('class', 'qh-fig-region');
      el.setAttribute('data-part', 'region');
      return el;
    }
    function choose(id) {
      markCurrent(fig, id);
      cfg.states.forEach(function (s) {
        if (s.id !== id || !svg) return;
        var old = svg.querySelector('[data-part="region"]');
        if (old) svg.replaceChild(region(s), old);
        var label = svg.querySelector('[data-part="region-label"]');
        if (label) {
          label.textContent = s.text;
          label.setAttribute('x', s.at[0]); label.setAttribute('y', s.at[1]); label.setAttribute('text-anchor', s.at[2]);
        }
        svg.setAttribute('aria-label', s.text + '; ' + (svg.getAttribute('aria-label') || '').split('; ').slice(1).join('; '));
      });
    }
    stateButtons(fig, choose);
    fig.classList.add('qh-fig-live');
    choose(cfg.initial);
  }

  function cohomology(fig, cfg) {
    var svg = fig.querySelector('.qh-fig-complex');
    function choose(id) {
      markCurrent(fig, id);
      cfg.states.forEach(function (s) {
        if (s.id !== id || !svg) return;
        var first = svg.querySelector('[data-part="first"]');
        if (first) first.setAttribute('d', s.toV ? cfg.paths.v : cfg.paths.zero);
        show(svg.querySelector('[data-part="first-zero"]'), !s.toV);
        var fl = svg.querySelector('[data-part="first-label"]');
        if (fl) fl.setAttribute('x', Math.round(s.toV ? cfg.mids.v : cfg.mids.zero));
        show(svg.querySelector('[data-part="h"]'), !!s.h);
        var hl = svg.querySelector('[data-part="h-label"]');
        if (hl) { hl.textContent = s.h; show(hl, !!s.h); }
        all('.qh-fig-basis[data-basis]', svg).forEach(function (g) {
          g.classList.toggle('is-alive', s.alive.indexOf(g.getAttribute('data-basis')) >= 0);
        });
      });
    }
    stateButtons(fig, choose);
    fig.classList.add('qh-fig-live');
    choose(cfg.initial);
  }

  function infinite(fig, cfg) {
    var env = { N: +cfg.control.initial };
    function update() {
      cfg.grids.forEach(function (g) {
        var svg = fig.querySelector('svg[data-grid="' + g.id + '"]');
        if (!svg) return;
        all('.qh-fig-cell', svg).forEach(function (cell) {
          var e = copy(env);
          e.i = +cell.getAttribute('data-i'); e.j = +cell.getAttribute('data-j');
          var on = val(g.rule, e) === true, t = cell.querySelector('text');
          cell.classList.toggle('is-on', on);
          if (t) t.textContent = on ? '1' : '0';
        });
        var beyond = svg.querySelector('[data-part="beyond"]');
        if (beyond) { var e2 = copy(env); e2.i = cfg.n; e2.j = cfg.n; beyond.classList.toggle('is-on', val(g.rule, e2) === true); }
      });
      var o = fig.querySelector('output[data-value="N"]');
      if (o) o.textContent = fmt(env.N);
      var rank = fig.querySelector('output[data-value="rank:' + cfg.rank.id + '"]');
      if (rank && cfg.rank.formula) rank.textContent = fmt(val(cfg.rank.formula, env));
    }
    var li = fig.querySelector('.qh-fig-control[data-param="N"]');
    if (li) {
      var input = rangeFor(fig, li, 'N', cfg.control, env.N);
      input.addEventListener('input', function () {
        env = { N: +input.value };
        input.setAttribute('aria-valuetext', fmt(env.N));
        update();
      });
    }
    fig.classList.add('qh-fig-live');
    update();
  }

  function adjunction(fig) {
    var keys = all('.qh-fig-key[data-key="eta"], .qh-fig-key[data-key="epsilon"]', fig);
    var pinned = '';
    function emphasise(which) {
      if (which) fig.setAttribute('data-emphasis', which); else fig.removeAttribute('data-emphasis');
    }
    keys.forEach(function (li) {
      var which = li.getAttribute('data-key') === 'eta' ? 'unit' : 'counit';
      var text = li.querySelector('.qh-fig-key-text');
      if (!text) return;
      var b = doc.createElement('button');
      b.type = 'button';
      b.className = 'qh-fig-key-button';
      b.setAttribute('aria-pressed', 'false');
      while (li.firstChild) b.appendChild(li.firstChild);
      li.appendChild(b);
      b.addEventListener('click', function () {
        pinned = pinned === which ? '' : which;
        keys.forEach(function (k) {
          var kb = k.querySelector('button');
          var kw = k.getAttribute('data-key') === 'eta' ? 'unit' : 'counit';
          if (kb) kb.setAttribute('aria-pressed', pinned === kw ? 'true' : 'false');
        });
        emphasise(pinned);
      });
      b.addEventListener('mouseenter', function () { if (!pinned) emphasise(which); });
      b.addEventListener('mouseleave', function () { if (!pinned) emphasise(''); });
    });
    fig.classList.add('qh-fig-live');
  }

  var MODELS = { 'gaussian-elimination': gaussian, 'two-expansions': expansions, 'cohomology-jump': cohomology,
                 'infinite-rank': infinite, 'adjunction-triangles': adjunction };
  all('figure[data-figure][data-config]').forEach(function (fig) {
    var cfg;
    try { cfg = JSON.parse(fig.getAttribute('data-config')); } catch (e) { return; }
    if (fig.classList.contains('qh-fig-live') || !MODELS[cfg.model]) return;
    MODELS[cfg.model](fig, cfg);
  });
})();
</script></body></html>
