  - id: A2-A1-04
    severity: 4
    status: undecided
    lens: "accessibility and interaction / sticky-header correction on pointer focus"
    target: "heal/mirror status.js:293-312 (clearRowHeader runs on every focusin inside .grid-wrap)"
    claim: "\"A mark focused while the table is scrolled sideways is brought clear of the sticky row header.\""
    broken_step: >-
      The correction also runs when focus comes from a mouse press: Chrome, and Firefox on Windows, focus a button on
      mousedown. The table therefore scrolls by (overlap + 4) px between mousedown and mouseup [expected]. If the press
      was within 4 px right of the header's edge:
      - mouseup lands on the neighbouring mark;
      - the click goes to the row, their common ancestor;
      - the document click handler then closes the card that focusin had just opened.
    evidence_type: line_reference
    evidence_ref: "status.js:302 gridWrap.scrollLeft -= (h.right - c.left) + 4; status.js:307-311 run on every focusin, whatever the input"
    files_read: ["materials/processed/qh-attack-heal-20261116/quality/heal/mirror/compiler/quantum-holography-status/status.js"]
    tools_used: ["Read"]
    confidence: low
    blast_radius: >-
      Mouse users clicking a mark that is partly under the row header, in a 4 px band. The second click works.
    minimal_heal: >-
      status.js (interaction): correct only keyboard-initiated focus (skip when el.matches(':focus-visible') is false),
      or defer the correction until after pointerup.
    residual: Needs real layout and real pointer events.
    deciding_evidence: >-
      Chrome at 768 px: scroll the grid so that a column of marks is partly under the row header; press a mark just
      right of the header edge; record whether its card opens.
referee:
  verdict: continue one cycle
  open_entries:
    - "C16 (severity 3): healed-unverified. The code is present and its logic is tested on stubbed geometry; only real layout can close it. Owner: root, through an approved browser route."
    - "C23 (severity 3): healed-unverified. The Close control is present and tested in jsdom; sheet geometry, iOS tap-outside and the safe-area offset need a touch browser. Owner: root."
    - "A2-A1-01 (severity 3, new): undecided. The new filter count and the existing search count are role=status regions set to display:none while empty, so first announcements are at risk; the filter count is a regression of this heal. It can be healed in-lane with one CSS rule or one JS line, then re-checked statically and with J7. Otherwise root records it as a screen-reader obligation."
  obligations_for_root:
    - "C16: Chrome, Firefox and Safari at 375, 480, 768 and 1024 px. With the grid scrolled sideways, reach marks by ArrowLeft, Home/End, Shift+Tab, and Tab from the row header. Assert document.activeElement.getBoundingClientRect().left >= its row th's right edge. Also click a partly covered mark and confirm its card opens (A2-A1-04)."
    - "C23: iOS Safari and Android Chrome at 375 px, touch. Open term, cell and column cards by tap; record whether the sheet covers its trigger. Close by the Close control (focus returns to the trigger), by tapping plain text outside the sheet, and by Escape on a hardware keyboard. Confirm the sheet's bottom clears the home indicator with the toolbar collapsed."
    - "A2-A1-01, if not healed: NVDA with Chrome and VoiceOver with Safari. Is the first 'Showing ... statements' message spoken after the first Show press? Is the first 'N matches' spoken after typing into an empty field, and after a tally link?"
    - "C15 (optional): measure rendered contrast of the not-posed dash. The token arithmetic already passes."
    - "Lens-wide browser checks for this candidate, none runnable here: Q14 Tab walk with visible focus, including the new bar opener and the card's Close button; Q19 touch target sizes; Q11 the 375 px bar with the extra button; Q23 console."
    - "Outside this lens, the external gate stays with the content owner and root (C20). The heals added no process tokens: draft 1, cycle 4 and phase 5 occur in both builds, and every context is mathematical or the citation 'author draft'. No tool names or private paths in either build."
  basis: >-
    Admissible evidence only. No browser, CDP, headless run or screenshot was used. jsdom has no layout, painting,
    scrolling or screen reader, so every geometry and speech claim above is labelled expected or unverified. I started
    no sub-agents, so there is no active reviewer to forward root's restriction to.
    Frozen inputs: the ledger, restriction, manifest, both diffs and both candidate previews match the stated sha256
    prefixes. The mirror files match the manifest's after-hashes. Both candidate previews embed the mirror status.js and
    CSS verbatim, and their bodies are identical.
    Lead jsdom suite, run read-only without --out: all 13 J-checks fail on the baseline and pass on the candidate, so
    they discriminate; R1-R9 pass on both; 0 page errors. Lead static checks (Q03, Q04-Q10, Q15-tex-in-names) pass on
    the candidate.
    Notes on the lead's checks: J2 passes by the Tab-into-Close path; only J2b exercises the new focusout rule. J6
    proves the arithmetic only, because its rectangles are static. J7 checks a class, not computed style, so it cannot
    see the :empty display:none rule (A2-A1-01). J10 covers the three ledger words only (A2-A1-02). jsdom 28 does fire
    popstate on fragment navigation and on history.back(), so J5's manual popstate is a second event; the check still
    discriminates.
    Attacks on the heals that survived [tested]: the popstate guard and capture-phase flush (type, follow a nav link at
    once, press Back; the query and ?q= are kept); the Close control (no trap, aria-expanded correct, Escape and Close
    both return focus); no printable-character shortcut remains; the new scopes leave status counts unchanged; the h3
    change affects no styling or search code.
