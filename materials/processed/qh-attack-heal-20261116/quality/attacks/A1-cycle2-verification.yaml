new_attacks:
  - id: A2-A1-01
    severity: 3
    status: undecided
    lens: "accessibility and interaction / status messages (WCAG 4.1.3)"
    target: "heal/mirror status.css:658 (.row-tools .filter-count:empty { display: none }), status.css:593 (.find-count:empty { display: none }, same as baseline); status.js:393-394 (filter region class changed from visually-hidden to filter-count)"
    claim: >-
      The status filter's count is "shown, not only announced" (status.js:394), and the search count line
      (role=status, aria-live=polite) announces each result count.
    broken_step: >-
      Both role=status regions are created empty and are display:none while empty. They are therefore not rendered,
      and not in the accessibility tree, until their first message. In the baseline the filter region was visually
      hidden but rendered from load. Screen readers announce unreliably a region that becomes displayed at the same
      moment its text is set [expected].
      Moments affected:
      - the first press of a "Show" filter after load (new in the candidate, a regression);
      - every first result count after the search field was empty, including the count a tally link sets just before
        focus moves to the field (present since the baseline).
    evidence_type: line_reference
    evidence_ref: |-
      status.css:658 .row-tools .filter-count:empty { display: none; }
      status.css:593 .find-count:empty { display: none; }
      jsdom at load: baseline filter region class "visually-hidden", role status, text "";
      candidate filter region class "filter-count", role status, text "" (so :empty applies);
      search count class "find-count", text "" in both builds.
    files_read: ["materials/processed/qh-attack-heal-20261116/quality/heal/mirror/compiler/quantum-holography-status/status.css", "materials/processed/qh-attack-heal-20261116/quality/heal/mirror/compiler/quantum-holography-status/status.js", "materials/processed/qh-attack-heal-20261116/quality/candidate/preview-nofonts.html", "materials/processed/qh-attack-heal-20261116/quality/baseline/preview-nofonts.html"]
    tools_used: ["Read", "Bash: grep", "Bash: node -e with jsdom 28 (read-only; scrollIntoView stubbed)"]
    confidence: medium
    blast_radius: Screen-reader users of the "Show" filter, the search field and the tally links.
    minimal_heal: >-
      status.css (foundation): replace both ":empty { display: none }" rules with a rule that keeps the element
      rendered but visually hidden while empty (the .visually-hidden declarations). Alternatively, status.js
      (interaction): give the filter count its "Showing all ... statements of the examples." text at load so it is
      never empty.
    residual: Speech output cannot be observed here.
    deciding_evidence: >-
      NVDA with Chrome and VoiceOver with Safari: after load, press "Published" once; type a first query into the empty
      search field; activate a tally link. Record whether each message is spoken. After the heal, a static re-check:
      no role=status element is display:none when empty.
