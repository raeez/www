- id: A1-A2-10
  severity: 3
  status: valid
  lens: "deep links (anchor stability)"
  target: "compiler/quantum-holography-status/status.py:622, 145-150, 439, 499, 531/576"
  claim: "Shared anchors survive retitling and reordering of content."
  broken_step: >-
    Open-group anchors are always derived from the heading; the content format has no id field for groups.
    Glossary anchors are derived from the term text, with order-dependent -2/-3 suffixes on collision.
    Questions fall back to the title and then to position; failures fall back to position; rows fall back to name.
