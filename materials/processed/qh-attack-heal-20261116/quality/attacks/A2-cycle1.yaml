- id: A1-A2-08
  severity: 3
  status: valid
  lens: "history (popstate on fragment navigation)"
  target: "compiler/quantum-holography-status/status.js:1033, 1017-1031, 837-845, 32-41"
  claim: "The address carries the reader's search and filters so that a view round-trips."
  broken_step: >-
    Every in-page link click is a fragment navigation, and fragment navigations fire popstate (expected per the HTML
    spec: "update document for history step application" with documentIsNew false). The popstate handler calls
    fromURL(false), which treats the URL as the truth. The URL can lag the page state in two cases:
    (a) Within 350 ms of a search change (line 844). The search field, its results and any row filter are reset to
    the old URL; then the pending timer writes the discarded query into the new entry, so the address and the page
    disagree.
    (b) Permanently, where writeParams swallows a throwing replaceState (line 40, "some file views"). Per the spec,
    content:, blob: and about:srcdoc views may only rewrite the fragment. There, every nav, grid, index or card link
    click resets the reader's search and row filter.
  evidence_type: line_reference
  evidence_ref: |-
    1033: window.addEventListener('popstate', function () { fromURL(false); });
    1028-1029: if (next.q === state.q.trim() && same(...) && same(...)) return; setState(next);
    1022: if (filters.length && !same(show, nowShown)) { ... applyFilter(false); }
    843-844: pendingAddress = {...}; addressTimer = setTimeout(flushAddress, 350);
    39-40: history.replaceState(...) } catch (e) { /* the address cannot be changed here (some file views) */ }
    jsdom fired 0 popstate events on a fragment navigation, so the race is not reproducible there.
  files_read:
    - compiler/quantum-holography-status/status.js
  tools_used: [Read, "sed -n", "node -e (jsdom 28; inconclusive)"]
  confidence: medium
  blast_radius: "Readers who search and then navigate within the page; in non-file offline views, every in-page link."
  minimal_heal: >-
    status.js (interaction): restore search and filter state on popstate only when location.search differs from the
    last search string the page wrote or read. Flush the pending address in a capturing click listener for in-page
    links.
  residual: "Browser confirmation is pending."
  deciding_evidence: >-
    In Chrome, Firefox and Safari:
    (1) Type "koszul" in the search and within 300 ms click "Examples" in the bar; record input.value and
    location.search.
    (2) Load the file from a blob: URL, press a row filter, click a grid row link; record the filter state.

