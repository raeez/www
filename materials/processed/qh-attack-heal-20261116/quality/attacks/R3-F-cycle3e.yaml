# R3-F check of the c3e status-contract delta (read-only reviewer; producer, audit, tests, atlas mapping, patch
# integrity). Saved from its report; its runtime line left out (reported in the handoff). Verdicts and referee
# summarised faithfully; attack entries condensed to id, severity, status, lens, broken step, minimal heal and
# deciding evidence.
basis: "No browser of any kind. Hashes unchanged before and after (MANIFEST 0d49eaf2, PATCH 38fd8710, foundation f24953df, interaction 4c33321b, preview d6dc0006, nofonts 29658c1a, foundation-only 1c6388f6, fixture page dc6ad7b5; status.py a4957eea, audit.py 42d29853, status.css adcfacd2, status.js 8c95f2cf; tests 3ed59844, be17eb77, b9516f01). Files written only under attacks/scratch-r3f-c3e/ (95 MB; do not commit); git status unchanged. The preserved 11:20 atlas JSON read-only, its ids used only for the page-versus-atlas status cross-check."
verdicts:
  - {id: patch-integrity-c3e, verdict: verified, evidence: "hunks at their stated lines reproduce all 7 after-hashes; split by owner, disjoint; PATCH = foundation + interaction; production at the before-hashes; apply-test trees as stated; rebuild byte-identical with identical audit.txt; foundation-only build equals 1c6388f6; on the current content the body markup, visible text and 428 ids identical to c3d; CSS and JS changed only for hypotheses"}
  - {id: lead-results-c3e, verdict: reproduced, evidence: "qh-static 11/11 on the candidate and the fixture; audit fixtures all as expected (baseline 20/114); builder fixtures 18/18 (baseline 2/18); jsdom 29/29 incl. J17; status-extension S1-S6, 0 page errors"}
  - {id: refuted-form-rendering, verdict: healed-verified, evidence: "status.py:28 after conditional; status.css:177 .st-refuted-form; print token present; light chip text about 5.5:1 on its tint; fixture: 2 articles st-refuted-form, data-status 'refuted form', chip and mark, tally 2, filter chip and facet, mix label; S1-S5 pass"}
  - {id: no-coercion, verdict: healed-verified, evidence: "statement() problem plus st-unknown, data-status as written, label \"Unknown status '…'\", no mark; status_mix and counts skip unknown statuses; changes draws no mark for an unknown status; a question's own mark None for an unknown status; status.js has no status list and no default to open; no CSS or print rule maps a status to open; the c3d producer on the fixture content fails and draws both as open, and Q06 fails on that page; S6 passes; 'refuted' fails with a st-unknown draft", residual: "an unknown cell status is still drawn as 'not posed' in the row marks but always fails the build (cells only; pre-existing)"}
  - {id: hypotheses, verdict: healed-verified, evidence: "2 items with MathML per fixture statement; malformed fails with the named problem; an empty list renders nothing and gives the warning; words searchable (principal statement via S5 --word; a question's own statement through its question card #q-...); print does not hide them", residual: "the list is not programmatically tied to its label, and the label is a status.py default rather than a page.json entry (severity 5)"}
  - {id: audit-schema, verdict: healed-verified, evidence: "with a key lacking 'refuted form' and hypotheses []: both warnings appear; the build passes; the current content's key explains the status"}
  - {id: qh-static-Q06, verdict: healed-verified, evidence: "passes on the fixture and on its own principal-only and question-status fixtures; fails on the coerced c3d page (data-status open, wrong chip)"}
  - {id: atlas-mapping, verdict: "consistent as stated; not checked mechanically", evidence: "CONTRACT.json states the mapping; qh-atlas-fidelity.py checks atlas codes and comparison lists only; no check compares a page statement with the atlas claim of the same id", residual: "A7-F-04"}
new_attacks:
  - {id: A7-F-01, severity: 3, status: valid, lens: "filters (root: 'consistently in … filters')", broken_step: "When a 'refuted form' statement sits only outside the example rows (a principal result, a question's own status, an open problem), the examples' Show filter still offers it; pressing it gives 'Showing 0 of 109 statements, in 0 of 20 examples.' and the empty note in all 20 rows; the lead's S2 and S3 fail on such content. This is A1-A2-18 (severity 4 in cycle 1) made concrete by the new status; exposure depends on where the 13:50 cards sit.", minimal_heal: "Row-filter chips from the statuses present in rows; search facets from page-wide statuses (the tally) so the tally link keeps its facet.", deciding_evidence: "On principal-only content no row filter for the status while the tally and facet still find the statement; on the lead fixture S1-S6 still pass."}
  - {id: A7-F-02, severity: 4, status: valid, lens: "lane tooling (status-extension checks)", broken_step: "S4 expects '<n> matches' (one statement gives '1 match'); S1 requires a mix; S5 requires a statement anchor although a question's own statement is reached through #q-...; correct pages fail.", minimal_heal: "Read the singular count; accept a missing mix outside rows; accept the question anchor for a question's own statement.", deciding_evidence: "Both probe pages pass S1, S4 and S5."}
  - {id: A7-F-03, severity: 4, status: valid, lens: "schema documentation", broken_step: "The README still lists statement statuses without 'refuted form' and STATEMENT without 'hypotheses' (CONTRACT.json updated, README not).", minimal_heal: "Add 'refuted form' (exact value, with a space) and hypotheses (a list of non-empty texts) to the README (root or the content writer).", deciding_evidence: "README text."}
  - {id: A7-F-04, severity: 4, status: valid, lens: "data fidelity (page against atlas)", broken_step: "No check compares the page's status with the atlas code for a shared id under the stated mapping (checked to checked, conditional to conditional, 'refuted form' to scoped_negative); on the 11:20 pair 22 ids are shared and 1 disagrees: decisive-centre-objectwise-coherence is 'checked' on the page and 'conditional' in the atlas.", minimal_heal: "qh-atlas-fidelity with --content: fail on a mismatch for shared ids; the content owner rules on anything outside the mapping.", deciding_evidence: "0 mismatches on the 13:50 pair."}
referee:
  verdict: "continue on one decision: heal A7-F-01, or root confirms that every 'refuted form' card in the 13:50 payload sits in an example row; every other claim of the delta is verified; acceptance as a whole stays blocked by the owners listed before."
  obligations_for_root:
    - "Decide A7-F-01 (a heal across both lanes, or a placement confirmation); then on the 13:50 payload: build and audit; qh-static Q06; qh-status-extension with --word <a word from a hypothesis>, reading S1, S4, S5 failures against A7-F-02; jsdom J1-J17; audit and builder fixtures; qh-atlas-fidelity plus the shared-id status cross-check (A7-F-04)."
    - "Visual and print checks of the new status in root's native session: chip and stripe colours in light and dark, the hypotheses layout, A4 and Letter."
    - "A2-A2-10: do not commit attacks/scratch-r3f-c3e (95 MB) or the earlier scratch folders."
  obligations_for_content_owner:
    - "Use the exact value 'refuted form', with a space; 'refuted' or 'Refuted form' fails the build."
    - "Give every such card hypotheses: a list of non-empty texts, TeX allowed; a missing or empty list gives a warning."
    - "Keep 'refuted form' explained in status_key."
    - "Word each card so that the chip 'Refuted as first posed' reads correctly: the card states the scoped negative result."
    - "Resolve page-versus-atlas status disagreements on shared ids (on the 11:20 pair: decisive-centre-objectwise-coherence)."
    - "Update the README schema lines, or ask root to (A7-F-03)."
