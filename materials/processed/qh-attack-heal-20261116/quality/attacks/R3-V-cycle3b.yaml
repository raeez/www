  runs: "Lead jsdom suite read-only: 28 of 28 pass, 0 page errors; own jsdom checks per verdict."
verdicts:
  - {id: A3-V-11, verdict: "partially healed; the heal introduces regression A4-V-01", evidence: "status.js:479-482 toggles .nav-overflow on load, resize and fonts.ready; status.css:664 fades at every width and overrides the >=900 px mask-image:none. J14 passes. Own run: the first call runs before the opener is shown (status.js:1084) so the class is not set at load in jsdom (no document.fonts); in browsers fonts.ready resolves later and corrects it.", residual: "Severity 5: call markNavOverflow() again after the opener is shown. Page image PIC-05, PIC-19."}
  - {id: A3-V-12, verdict: healed-verified in source and jsdom, evidence: "count line visually hidden while no filter is on, keeps role=status; load 1px, Published visible ('Showing 4 of 109 statements, in 4 of 20 examples.'), cleared hidden with text kept, ?show=published visible; J13, J15 pass.", residual: "Speech not observable; PIC-14."}
  - {id: A3-V-13, verdict: "healed-verified in source and jsdom; print part from the CSS rule only", evidence: "With Published 20 of 20 mixes hidden ('0 of 15 statements'); cleared 0 hidden; beforeprint full counts and mix shown, afterprint filtered again; ?show=published filtered at arrival; decisive known-heads unaffected; J15, J7b pass.", residual: "PIC-15, PIC-16; unfiltered raggedness A3-V-05 remains."}
  - {id: A3-V-15, verdict: "healed-verified for the static layout; regression A4-V-02 (severity 4) on cards whose text scrolls", evidence: "card-inner padding-right 16px; first child 28px; others none; first line inset 44 px clears the 32 px control.", residual: "PIC-17."}
  - {id: A3-F-06, verdict: "healed for visibility; regression A4-V-03 (severity 3) for the keyboard with foundation.diff alone", evidence: "status.py emits .card-close hidden; [hidden] rule keeps it display:none; status.js shows it when wiring; J16 passes; foundation-only page: Close and opener hidden.", residual: "A4-V-03; PIC-21."}
new_attacks:
  - {id: A4-V-01, severity: 3, status: valid, lens: "usability and contrast of the bar (regression of the A3-V-11 heal at 900-1044 px; the same defect exists in the baseline at 480-899 px)", broken_step: "The fade is fixed to the nav box and does not follow the scroll position; scrolled to its end (Terms current, keepInSight, or Tab to Terms) the last link sits in the faded band (12% of the box, 88 px at 1024; keepInSight clears only 28 px). Last glyph of 'Terms' at 1024: opacity 0.38, 1.78:1 plain / 2.30:1 current (light); 960: 0.42; 900: 0.46; baseline 768: 0.56; 480: 0.84. Fails WCAG 1.4.3 in that state.", minimal_heal: "A fixed 28 px fade on .nav.nav-overflow only (mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent)) and no unconditional fade on .nav; or clear the class from a scroll listener when scrollLeft + clientWidth >= scrollWidth - 1.", deciding_evidence: PIC-19}
  - {id: A4-V-02, severity: 4, status: valid, lens: "balance of the card (regression of the A3-V-15 heal)", broken_step: "Only the first child is inset; when a long card scrolls, later lines pass under the transparent 32 px Close control and its X is drawn over line ends. Computed: 1 of 144 term cards scroll at 1400x900, 0 at 1024x768 and the 375x667 sheet, 28 of 144 at 812x375.", minimal_heal: "Give .card-close an opaque background (the card's), or a non-scrolling header with the title and Close above a scrolling body; keep the first-child inset.", deciding_evidence: PIC-20}
  - {id: A4-V-03, severity: 3, status: valid, lens: "keyboard operation in a configuration the MANIFEST declares safe (regression of the A3-F-06 heal)", broken_step: "With foundation.diff alone the baseline script's Tab handler (status.js:217-223, inCard = all('a[href], button', card)) takes the hidden Close as the card's first control: Tab from a pinned trigger is prevented and focus is sent to a display:none element, so in a browser focus stays on the trigger (pinned term and pinned column head); on the baseline Tab enters the card's link or is not prevented.", minimal_heal: "Let status.js create the Close control when it wires it, so the baseline script never sees a hidden button; or state that foundation.diff requires interaction.diff and drop 'each patch is safe alone'.", deciding_evidence: PIC-21}
