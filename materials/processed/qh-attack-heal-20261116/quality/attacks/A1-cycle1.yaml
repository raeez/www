survived:
  - "Skip link: it is the first Tab stop, appears on focus above the bar (z-index 30 vs 20) and targets main[tabindex=-1] (status.py:702,708; status.css:95-96) [inspected]."
  - "Reach and operate every control class by keyboard (theme, nav, tally, search field, facet chips, results, grid marks and heads, row summaries, Open all/Close all, filters, terms, pinned-card links, formula boxes). All are native buttons, links or summaries; wide formulas get tabindex=0 (status.js:1000-1007) [inspected; tested for column heads, terms and search]."
  - "No keyboard trap: the card's Tab handler always passes focus to the next tabbable element or back to the owner, and the arrow handlers never intercept Tab (status.js:217-237, 243-273) [inspected]."
  - "Focus order follows reading order: the search is inserted after the tally, the added Open all/Close all precede their list, and no CSS reorders focusable elements [inspected]."
  - "ARIA references: after the scripts run there are 0 broken idrefs (aria-labelledby, describedby, controls, for) and 0 duplicate ids [tested]."
  - "Text equivalents for status: status chips, the legend, the key, cell-line text, mix counts with visually hidden status names, question-index marks (role=img with aria-label), result status text and cell aria-labels (apart from A1-A1-09) [observed]."
  - "Status without colour: the ten statuses use ten distinct mark shapes (status.py:31-49); the dashed border and colour stripe are redundant with the chip text [observed; heuristic at 11 px]."
  - "Text contrast in light and dark: every text token pair in use is at least 4.5:1. The lowest is ink-4 on paper-2 at 4.500002 (the grid corner label), which passes with zero margin. Status chip text on its tint is at least 4.52 [computed]."
  - "Focus ring contrast: 6.46-7.47:1 in the light theme and 5.18-10.90:1 in the dark theme against every background computed, including pressed chips and the selected cell [computed]."
  - "Reduced motion: smooth scrolling and transitions apply only under prefers-reduced-motion: no-preference, and smooth() returns 'auto' under reduce (status.css:81,633-635; status.js:7) [inspected]."
  - "Tally links: their counts equal the search's status counts (197, 6, 74, 4), and activating one moves focus to the search with the count announced [tested]."
  - "Search keyboard model: Down, Up, Home, End and Escape work in the results; Enter goes to the first hit; Clear and Show all hand focus on (status.js:768-811) [inspected; Down tested without the race in A1-A1-03]."
  - "Address state: ?show, ?q, ?in and ?status are restored on arrival and on popstate [tested on arrival]."
  - "A hit inside closed or filtered content: go() opens the enclosing details, lifts the status filter, and handles the case where the hash is already the target (status.js:49-56, 914-926) [inspected]."
  - "Open all and Close all act only within their own section [tested: the frontier's Open all left the rows untouched]."
  - "Sticky page bar: html scroll-padding-top of calc(var(--bar) + 16px) keeps fragment and scrollIntoView targets below the 51 px bar (status.css:80) [inspected; focus-scroll behaviour in browsers expected]."
  - "Print: every disclosure opens on beforeprint and is restored on afterprint; statements hidden by a filter are printed; the card, search and tools are hidden (status.js:412-423; status-print.css:58-60,153) [inspected]."
  - "Landmarks: the two question indexes have distinct names (label plus section heading), each section is a named region, and there is one search landmark (status.py:483-484) [inspected]."
  - "Live regions (the search count line and the filter count) exist before their first update (status.js:336-348, 750-753) [inspected]."
  - "Hidden content stays silent: cell notes, the closed card and the hidden facets carry [hidden]; decorative marks and the row-mark strip are aria-hidden, and the grid duplicates the strip's information [observed]."
  - "iOS focus zoom: the search input uses 17 px text (16 px or more), so iOS does not zoom when it is focused (status.css:9,568) [inspected]."
