# A1 first-wave attacker (read-only; lens: accessibility and interaction), returned 2026-11-16. Saved from its report
# before consolidation; absolute worktree paths shortened to repository-relative paths, and its runtime line left out
# (runtime checks are reported in the handoff message, not in persistent files). The adjudication is in LEDGER.yaml.
- id: A1-A1-01
  severity: 3
  status: valid
  lens: "accessibility and interaction / keyboard focus, content on hover or focus (WCAG 1.4.13, 2.4.3)"
  target: "compiler/quantum-holography-status/status.js:210-216 (document keydown, Escape branch)"
  claim: >-
    Escape closes the floating card and gives focus back to the card's trigger. The comment at
    status.js:194 says this is intended: "focus handed back to a trigger after Escape does not reopen its card".
  broken_step: >-
    Line 214 calls owner.focus() whenever document.activeElement is not the owner. It never checks
    where focus actually is. Two supported paths move keyboard focus away from the reader.
    (a) Hover card [tested]: keyboard focus is on some control and the pointer hovers a term, which opens
    the term's card (owner = the hovered term). Pressing Escape hides the card and moves focus to the
    hovered term. If focus was in the search field, the same key press also clears the query: the input's
    own Escape handler (status.js:777-779) runs first and the event still bubbles up to this handler.
    (b) Stale pinned card [tested]: a pinned card stays open after focus leaves it (A1-A1-02). Escape pressed
    on a later control, or in the search field, pulls focus back to the old trigger.
  evidence_type: failing_test
  evidence_ref: |-
    node + jsdom 28, read-only script on preview-nofonts.html (scrollIntoView stubbed; for (a) window.matchMedia
    stubbed so that '(hover: hover) and (pointer: fine)' matches):
    (a) 1 focus on filter "Proved and independently check" | hover card open for "local vacuum" : true
        2 Escape -> card hidden true | focus now on term "local vacuum"
        3 Escape in search with hover card -> query now "" | focus now on term "local vacuum"
    (b) 3 Tab to col-head 2 (+300ms) | card hidden: false | card title: "Algebra and geometry" | ... | focus: col-head Koszul dual
        4 Escape on col-head 2 | card hidden: true | ... | focus: col-head Algebra and geometry
        (term pinned, then '/') C Escape in empty search: focus -> term "associated positive-definite e"
    status.js:214  if (back && doc.activeElement !== back) { returning = true; back.focus(); returning = false; }
  files_read: ["compiler/quantum-holography-status/status.js", "materials/processed/qh-attack-heal-20261116/quality/baseline/preview-nofonts.html"]
  tools_used: ["Read", "Bash: node -e with jsdom 28 (read-only, stdout only)"]
  confidence: high
  blast_radius: >-
    Keyboard users, and mouse-plus-keyboard users, who close a card with Escape. Search users lose
    their query and their focus position with one key press. Fails 1.4.13 (dismissal must not move keyboard
    focus) and 2.4.3 (focus order).
  minimal_heal: >-
    status.js (interaction): in the Escape branch, always hide the card, but call back.focus() only
    when focus is inside the card (card.contains(document.activeElement)) or is on body.
  residual: >-
    Path (a) ran with a matchMedia stub because jsdom has no real hover. Screen-reader announcement of the
    focus jump was not checked.
  deciding_evidence: >-
    Chrome desktop with a mouse: Tab to a "Show" filter chip, hover a dotted term until its card shows,
    press Escape, then evaluate document.activeElement. Now: the term button. After the heal: the chip.

