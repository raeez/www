    last one continues after the trigger". The card describes the control that has focus.
  broken_step: >-
    A pinned card (opened with Enter, Space or a click) is not closed when focus leaves its trigger for
    anything outside the card. Column-head cards contain no link or button (none in any of the 8 .col-def
