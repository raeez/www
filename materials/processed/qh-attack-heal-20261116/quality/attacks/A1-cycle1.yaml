- id: A1-A1-07
  severity: 3
  status: valid
  lens: "accessibility and interaction / character key shortcut (WCAG 2.1.4, Level A)"
  target: "status.js:975-984 ('/' handler); hint text status.js:436"
  claim: "Hint: \"Press / to search from anywhere on the page\"."
  broken_step: >-
    '/' with no modifier is bound on document keydown for the whole page. The only exception is focus in
    an input, textarea, select or contenteditable element (line 979). The reader cannot turn the shortcut
    off or remap it, and it is not limited to a focused component. WCAG 2.1.4 requires one of these three.
  evidence_type: line_reference
  evidence_ref: |-
    status.js:977  if (event.key !== '/' || event.ctrlKey || event.metaKey || event.altKey || event.defaultPrevented) return;
    status.js:980-981  event.preventDefault(); focusSearch();
    The page has no settings control for the shortcut [observed].
  files_read: ["compiler/quantum-holography-status/status.js"]
  tools_used: ["Read"]
  confidence: high
  blast_radius: >-
    Speech-input users: a dictated or stray "/" moves focus to the search field and scrolls the page.
    Keyboard users who type '/' while on any control. The pinned-card interaction is described in
    A1-A1-01 and A1-A1-02.
  minimal_heal: >-
    status.js (interaction): require a modifier for the shortcut, or add an on-page switch that disables
