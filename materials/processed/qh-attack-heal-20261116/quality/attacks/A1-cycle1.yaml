    cell lies inside the scroll box but under the sticky header. The browser either does not scroll at all
    or scrolls the cell to the left edge, which is still under the header. Either way the focused mark and
    its ring are hidden [expected].
    Estimated widths [computed from EB Garamond advance widths and the CSS sizes]: the table needs at
    least 873 px against a 343 px box at 375 px, 873 vs 442 at 480 px, 1065 vs 707 at 768 px, 1109 vs 944
    at 1024 px, and 1173 vs 1216 at 1400 px (fits). The sticky header is 113 px wide at 640 px and below,
    and 187 px at 1024 px.
  evidence_type: line_reference
  evidence_ref: |-
    status.css:202 .grid tbody th { position: sticky; left: 0; z-index: 1; ... background: var(--paper-3); min-width: 11.5em; max-width: 15em;
    status.css:332 (max-width 640px) .grid tbody th { min-width: 8.5em; max-width: 9.5em; }
    python3 -I -B fontTools estimate: vw=375 ... grid min table=873px vs wrap=343px scrolls=True | sticky th=113px; vw=1024 ... 1109px vs 944px scrolls=True | sticky th=187px
  files_read: ["compiler/quantum-holography-status/status.css", "compiler/quantum-holography-status/status.js"]
  tools_used: ["Read", "Bash: python3 -I -B with fontTools (reads EBGaramond-Regular.otf; no writes)"]
