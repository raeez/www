- id: A1-A1-11
  severity: 3
  status: undecided
  lens: "accessibility and interaction / focus hidden in the horizontally scrolling grid"
  target: "status.css:194 (.grid-wrap overflow-x:auto), 202-203 and 332 (sticky opaque row header, z-index 1); status.js:240-274 (arrow keys)"
  claim: "Focus is always visible; Tab and the arrow keys move through the grid's marks."
  broken_step: >-
    When the table is wider than its box, the row-header column is sticky at left: 0, has an opaque
    background and sits on z-index 1. .grid-wrap sets no scroll-padding-left. Suppose the table is
