- id: A1-A1-03
  severity: 3
  status: valid
  lens: "accessibility and interaction / focus loss after DOM replacement (search)"
  target: "status.js:763-771 (input debounce, ArrowDown branch), 846 (results.textContent = '')"
  claim: "Search hint (status.js:436): \"the down arrow moves through the results\"."
  broken_step: >-
    The input handler delays run() by 90 ms (line 765). The ArrowDown branch (769-771) focuses the first
    link of the result list that is currently shown, which may belong to the previous query, and does not
    first run the pending query. The Enter branch (772-776) does run it. When the 90 ms timer fires, run()
    empties the result container (846) and removes the focused link, so focus falls to body [tested].
  evidence_type: failing_test
  evidence_ref: |-
    jsdom: after vertex: 81 matches
    set value "vertex algebra", dispatched input then ArrowDown in the same tick:
    ArrowDown 0ms after typing -> focus: find-link "Proved and independently checkedSiegel–W" | connected: true
    +150ms: count 78 matches | previously focused link still in DOM: false | activeElement: BODY
  files_read: ["compiler/quantum-holography-status/status.js", "materials/processed/qh-attack-heal-20261116/quality/baseline/preview-nofonts.html"]
  tools_used: ["Read", "Bash: node -e with jsdom 28 (read-only)"]
  confidence: high
  blast_radius: >-
    Keyboard and screen-reader users who press Down less than 90 ms after the last keystroke (fast
    typing, paste then Down, dictation). Focus is lost, and the result they reached belonged to the
    previous query.
  minimal_heal: >-
    status.js (interaction): in the ArrowDown branch, if input.value differs from state.q, call
    clearTimeout(timer), set state.q = input.value and limit = 40, and run(true) before focusing the
    first .find-link, as the Enter branch does.
  residual: How often real users press Down within 90 ms was not measured.
  deciding_evidence: >-
    Chrome: type "vertex" and wait; paste " algebra" and press Down at once (or send both keys through
    DevTools with 0 ms delay); evaluate document.activeElement after 200 ms.

- id: A1-A1-04
  severity: 3
  status: valid
  lens: "accessibility and interaction / state round trip (row disclosures)"
  target: "status.js:277-291 (openTarget runs only on hashchange), 305-312 (Open all/Close all), 357-361 (applyFilter closes rows)"
  claim: "Comment at status.js:276: \"Rows open when they are the target of a link, and a link into a row opens it.\""
  broken_step: >-
    A row opens only on a hashchange event. "Close all" (bindExpand) and the status filter (d.open = any)
    close the row that the address names but leave location.hash as it is. Following a link to that row
    again (the grid's row-header link, or the row link inside a cell card) does not change the hash, so
    no hashchange fires and the row stays closed. The reader is scrolled to a closed row [tested]. The
    search has its own branch for this case (status.js:920); plain links have none.
  evidence_type: failing_test
  evidence_ref: |-
    jsdom (url https://example.test/...):
    1 grid link clicked: hash #row-heisenberg | row open true | hashchange events 1
    2 Close all: row open false | hash #row-heisenberg
    3 same grid link clicked again: row open false | hashchange events 1
    4 cell card row link clicked: row open false | card hidden true | hashchange events 1
  files_read: ["compiler/quantum-holography-status/status.js", "materials/processed/qh-attack-heal-20261116/quality/baseline/preview-nofonts.html"]
  tools_used: ["Read", "Bash: node -e with jsdom 28 (read-only)"]
  confidence: high
  blast_radius: >-
    Grid-to-row navigation (20 row-header links, 160 cell-card row links) after Close all or after
    using a status filter. Affects keyboard, pointer and screen-reader readers alike.
  minimal_heal: >-
    status.js (interaction): one option is a delegated click handler for a[href^="#"] that calls
    openTarget() after the default action when the link's fragment equals location.hash. The other is
    to call setHash('', false) in bindExpand and applyFilter when they close the row named by the hash.
  residual: Not run in a real browser. By the HTML spec, hashchange does not fire when the fragment is unchanged.
  deciding_evidence: >-
    Chrome: click the grid link "Heisenberg, free fields...", click Close all, click the same link again;
    evaluate document.getElementById('row-heisenberg').open.

