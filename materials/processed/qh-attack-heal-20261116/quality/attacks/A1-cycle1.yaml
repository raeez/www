  evidence_type: failing_test
  evidence_ref: |-
    jsdom on preview-nofonts.html:
    2 Enter (click) col-head 1 | card hidden: false | card title: "Algebra and geometry" | expanded: Algebra and geometry=true, ...
       Tab keydown defaultPrevented: false
    3 Tab to col-head 2 (+300ms) | card hidden: false | card title: "Algebra and geometry" | expanded: Algebra and geometry=true, Koszul dual=false, Module comparison=false | focus: col-head Koszul dual
    B after / : focus find-q "" | card still open: true | card title "Associated lattice"
    status.js:147  if (pinned) return;     status.js:197  if (el && !pinned && !returning) show(el, false);
  files_read: ["compiler/quantum-holography-status/status.js", "compiler/quantum-holography-status/status.py", "materials/processed/qh-attack-heal-20261116/quality/baseline/preview-nofonts.html"]
  tools_used: ["Read", "Bash: node -e with jsdom 28 (read-only)"]
