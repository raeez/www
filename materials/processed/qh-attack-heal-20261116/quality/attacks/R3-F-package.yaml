  - {id: A8-F-02, severity: 4, status: valid, lens: "integration with interaction's final status.js", broken_step: "The quality lane's status.js skips '.statement-hypotheses .note-label' in search bodies; the foundation's label is '.statement-hyp-label', so 'Hypotheses' would be indexed.", minimal_heal: "Interaction's final handoff skips .statement-hyp-label.", deciding_evidence: "A search for 'hypotheses' finds only real text."}
  - {id: A8-F-03, severity: 5, status: valid, lens: guard, broken_step: "apply.sh does not verify page.json f0a6edc5, the wrapper or status.js, although MANIFEST.json lists them as unchanged_pins.", minimal_heal: "Add the unchanged_pins to the before-check.", deciding_evidence: "A tree with another page.json is refused."}
  - {id: A8-F-04, severity: 5, status: valid, lens: "warning noise", broken_step: "'frozen' in mathematical prose warns as process vocabulary; 250 identifier-shape warnings on atlas anchors (p1, r3, ...) bury the warnings that need reading.", minimal_heal: "Group identifier-shape warnings for anchors into one count line; keep 'frozen' only next to receipt or snapshot wording.", deciding_evidence: "A readable warnings list."}
