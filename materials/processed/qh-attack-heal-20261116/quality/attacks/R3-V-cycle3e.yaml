# R3-V check of the c3e status-contract delta (read-only reviewer; rendering, colours and legend, filters, counts,
# search, accessibility, no coercion). Saved from its report; its runtime line left out (reported in the handoff).
# Verdicts, page-image checks and referee as returned; attack entries condensed (target, evidence_ref, files_read,
# tools_used omitted).
basis:
  limitation: "No browser of any kind; jsdom 28.1.0 read-only; contrast and widths from the CSS tokens, WCAG luminance and hb-shape. Wrote nothing; started no jobs."
  frozen_inputs: "MANIFEST 0d49eaf2, preview d6dc0006, nofonts 29658c1a, status.css adcfacd2, status.js 8c95f2cf, status.py a4957eea, fixture page dc6ad7b5, qh-status-extension b9516f01, qh-jsdom-checks 2dc2257c match. c3d to c3e: CSS .st-refuted-form, .st-unknown and .statement-hypotheses; status.js adds .statement-hypotheses .note-label to the three search skip lists; the candidate's markup unchanged (the current content has no refuted-form statement and no hypotheses); renderer changes status.py:26-28, :347-378, status_mix :527; audit.py:376-388."
  runs: "status-extension S1-S6 PASS on the fixture, 0 page errors; lead jsdom 29/29 on the candidate with the J17 inputs; J7, J7b, J13, J15, R3, R9 also pass on the fixture; qh-static 3ed59844 every key PASS on the candidate and the fixture; fixture audits refuted-form PASS, refuted-inexact FAIL, hypotheses-malformed FAIL, refuted-unscoped PASS with a warning."
verdicts:
  - {claim: card and chip, verdict: "verified (source, jsdom, computed)", evidence: "both fixture cards 'statement st-refuted-form'; children statement-head, statement-text, statement-hypotheses; chip 'Refuted as first posed', cross aria-hidden; solid border; --st-refuted-form in light, both dark blocks and print; chip text on its tint light 5.47 (card) and 5.30 (question), dark 5.45 and 6.29, print 7.71; stripe light 6.46/6.25, dark 6.55/7.42, print 7.71; chip 212.5 of 311 px at 375 (68%), 239 of 596 px at 1400", residual: "A7-V-01; protanopia refuted red vs checked green OKLab dE 0.043 in light, chip text and shapes still separate them"}
  - {claim: hypotheses, verdict: verified, evidence: "'Hypotheses' label and two items per card, one with MathML; search 'hypotheses' 24 matches, none the two cards (label not indexed); 'finite length', 'generic', 'fails for' find both cards with 'Refuted as first posed' as the shown place; status.py:371-378 renders hypotheses on any status and fails a non-list", residual: "A7-V-02"}
  - {claim: legend and key, verdict: verified, evidence: "key dt 'Refuted as first posed' with content.status_key's explanation; compact grid legend unchanged; audit warns when a statement status in use is not explained in the key", residual: "a statement-only use without a status_key entry only warns; keep the key entry in the final payload"}
  - {claim: filters and counts, verdict: verified, evidence: "row filters checked, conditional, refuted form, open, published; facets match; filter shows one row statement, 'Showing 1 of 110 statements, in 1 of 20 examples.', ?show=refuted+form; arrival restores it; with Published 'Showing 5 of 110...', ?show=refuted+form%2Cpublished; tally pill 2 opens the search with the facet pressed, '2 matches'; row 1 mix '14 Proved and independently checked 1 Refuted as first posed 1 Open problem'; open tally 74 equals 74 open statements; on the candidate no refuted-form filter, pill or facet, and ?status=refuted+form&show=refuted+form arrival drops both values", residual: "A7-V-04"}
  - {claim: no coercion, verdict: verified, evidence: "no refuted-form card carries st-open; refuted-inexact renders st-unknown with the chip \"Unknown status 'refuted'\", no mark, filter or pill, and its audit fails; both baseline coercion paths removed (statement(), status_mix())", residual: "A7-V-03"}
new_attacks:
  - {id: A7-V-01, severity: 3, status: undecided, lens: "communication of the status (colour, label, legend)", broken_step: "On a statement card the chip names the status of the card's own statement; a red 'REFUTED AS FIRST POSED' chip and stripe above a proved negative statement ('the comparison fails for k≠0') can be read as 'this statement is false'. The page already shows proved negative results another way (Natural statements that fail: the claim tagged 'False', its counterexample 'Proved and independently checked'), so the same kind of result would carry two codes. Label ownership is disputed (A1-A2-15 / C27): content.status_key says 'Refuted form', page.json 'Refuted as first posed'; the atlas reader rule asks labels to distinguish scoped negatives from checked conclusions.", minimal_heal: "A ruling by root and the content owner on the reader label for statement cards (the value 'refuted form' unchanged), e.g. a label saying the result is checked and negative within its scope, distinct from the cell label; no scientific text changes.", deciding_evidence: "PIC-24"}
  - {id: A7-V-02, severity: 4, status: valid, lens: "search communication", broken_step: "The search snippet runs the text and the hypotheses together with no label or separator: '…comparison fails for k≠0. the level k is generic the module has finite length'.", minimal_heal: "In textOf separate list items with '; '; show the label in the snippet without making it searchable.", deciding_evidence: "Search 'finite length' on the fixture."}
  - {id: A7-V-03, severity: 3, status: undecided, lens: "schema validation of the explicit negative status", broken_step: "A 'refuted form' statement without hypotheses builds PASS with only a warning; the page then shows an unscoped red card that can be read as an unconditional negative.", minimal_heal: "If the content contract makes hypotheses mandatory for 'refuted form' (root or the content owner decides), make it a failure; otherwise state in the README that the scope may be given in the text.", deciding_evidence: "The ruling, then the refuted-unscoped fixture fails or is documented."}
  - {id: A7-V-04, severity: 4, status: valid, lens: filters, broken_step: "Row filters come from page-wide counts (status.py:721-722): a status used only outside the examples gives a filter that empties all 20 rows ('No statement in this example has the selected status.'); pre-existing for every status, more likely with a rare new one.", minimal_heal: "Build the row filters from the row statements' counts; the tally keeps page-wide counts.", deciding_evidence: "A fixture with 'refuted form' only among the principal results: no row filter for it, the tally pill remains."}
page_image_checks:
  - "PIC-24 (heal/fixtures/c3e/refuted-form/page.html dc6ad7b5): at 1400 and 375, light and dark, #s-scoped-negative-principal and, in row 1, #s-scoped-negative-fixture: red stripe, solid frame, red chip with its cross fitting at 375; the text, then the 'Hypotheses' label and a two-item list (first item with k), smaller than the text with even spacing; judge A7-V-01 beside a card in 'Natural statements that fail'."
  - "PIC-25: at 1400 light, press the row filter 'Refuted as first posed': one statement visible; 'Showing 1 of 110 statements, in 1 of 20 examples.'; row 1 summary '1 of 16 statements' with its marks hidden; click the tally pill '2 Refuted as first posed': '2 matches', facet pressed, both cards listed; search 'finite length' and read the snippet (A7-V-02); repeat in dark."
  - "PIC-26: A4 and Letter print preview of the fixture with the filter pressed: both cards print with the deep red stripe (#962f20), chip text and hypotheses list; every row statement prints; rows show full counts with marks."
  - "PIC-01 to PIC-23 stand; the candidate's markup is unchanged from c3d."
referee:
  verdict: "The delta holds for rendering, colours and legend, filters, counts, search, accessibility and no coercion (source, jsdom, static, computed contrast); no regression in the candidate (markup unchanged, 29/29). Two severity-3 entries are undecided and need rulings, not code (A7-V-01 label, A7-V-03 hypotheses mandatory); two severity-4 entries have one-line heals (A7-V-02, A7-V-04). The visual pass stays with root's primary session; closure on the final payload needs S1-S6, the lead suite with the J17 inputs, the static checks and the audit on root's frozen payload."
  obligations_for_root:
    - "Rule on A7-V-01 (label) and A7-V-03 (hypotheses mandatory or not) with the content owner; scientific text unchanged."
    - "Native visual pass: PIC-24, PIC-25, PIC-26 on the fixture page, plus PIC-01 to PIC-23 on the candidate."
    - "On the frozen final payload: qh-status-extension S1-S6 if it uses 'refuted form'; the lead suite with --baseline and --foundation-only; qh-static with --content; the build audit; confirm the key explains 'refuted form' and the row filter matches where these statements sit (A7-V-04)."
