new_attacks:
  - {id: A4-F-01, severity: 3, status: valid, lens: "audit false failure (long exact integers)", broken_step: "HASH matches digit-only runs of 32 or more; an exact integer of that length fails as a hash in TeX, prose, \\text{}, attributes and data blocks (the Monster order has 54 digits; current content prints 24-digit coefficients).", minimal_heal: "Require at least one a-f letter and one digit in both hash rules.", deciding_evidence: "54- and 35-digit numbers pass in TeX and prose; 40-hex probes still fail."}
  - {id: A4-F-02, severity: 3, status: "valid (integration obligation)", lens: "final-payload false failures (ASCII mathematics)", broken_step: "The preserved atlas, embedded or rendered with TeX removed, fails 19-20 times on ASCII mathematics (C0/C1 regularity, C1=pi delta(t), Omega=C1(a), N12=0, [H_total,R1], E1(z), E1=theta′/theta, a1 a2 u3 v4 v5 v6) and on schema .../v1; failure names say internal identifier and version tag; 894 formula-outside-TeX and 81 id warnings would bury the rest. All 503 claim, 53 edge, 58 comparison and 18 path ids pass.", minimal_heal: "Content owner: set these in TeX (\\(C^1\\), \\(v_4\\), \\(E_1(z)\\)); atlas lane and root: drop /v1, SVG labels in the text form; foundation: name the likely cause in the identifier failure and group warnings by rule with counts.", deciding_evidence: "The final payload builds with 0 identifier or version-tag failures."}
  - {id: A4-F-03, severity: 3, status: valid, lens: "data fidelity (Temml guard coverage)", broken_step: "The guard needs braces around \\rm (\\rm M24 unchecked) and looks for the group text anywhere in the joined token text (\\mathrm{X12}^2 and \\mathrm{M24}\\subset M_{24} pass); the reader sees corrupted digits.", minimal_heal: "Fail on the source pattern itself: a letter followed by two or more digits inside \\mathrm{...} or a \\rm run, braced or not, with the named fix; or patch the vendored merge.", deciding_evidence: "The three probes fail with the named fix."}
  - {id: A4-F-04, severity: 3, status: valid, lens: "public safety (images as data: URIs)", broken_step: "The CSP allows img-src data:; an SVG image in a data: URI (base64, percent-encoded, or a CSS background) is never decoded, so a model name, a /Users/ path, ledger T12 or Wave 3 in its text passes; the docstring says image text is scanned.", minimal_heal: "Decode data:image/svg+xml payloads in attributes and url() and scan them as images; or fail any data: SVG image.", deciding_evidence: "The three probes fail; the candidate passes."}
  - {id: A4-F-05, severity: 4, status: valid, lens: "lane tooling (combined QA)", broken_step: "qh-static Q07 takes the expected row name from the grid header, which shows short when present; correct pages with short labels fail.", minimal_heal: "Take the expected name from the row summary's .row-name or the header link's title.", deciding_evidence: "A fixture with rows[0].short passes Q07."}
  - {id: A4-F-06, severity: 4, status: valid, lens: "audit false failures (script scanner)", broken_step: "Template-literal interpolations are scanned as strings (`<b>${owner.id}</b>` fails); developer comments with owner or commit fail; a string list such as ['agent', 'prompt'] fails.", minimal_heal: "Exclude ${...} spans; apply only names, paths and hashes to comments.", deciding_evidence: "The probes pass; a comment naming a model still fails."}
  - {id: A4-F-07, severity: 4, status: valid, lens: "content-writer documentation", broken_step: "README does not state the \\mathrm{M}_{24} digit rule, that ASCII mathematics (C1, v4) fails, or that long numbers and hashes fail.", minimal_heal: "Add these rules to the README's audit section.", deciding_evidence: "README text."}
  - {id: A4-F-08, severity: 4, status: valid, lens: "remaining leak classes (lower plausibility)", broken_step: "Pass: a model or account name with digits (claude8); session UUIDs and short hex ids; ledger ids with other letters (A2-A2-10, Q04); receipt, frozen, snapshot, manifest, provenance; \\label{...} in TeX annotations; CSS custom-property strings; 87\\,\\%; stage labels with an en dash; multi-word entries in hyphenated ids (frontier-engine).", minimal_heal: "Extend NAMES to digit suffixes; LABEL in TeX-source rules; the words as warnings.", deciding_evidence: "Probes flagged; the candidate passes."}
