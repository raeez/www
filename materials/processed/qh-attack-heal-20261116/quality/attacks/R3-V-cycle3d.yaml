verdicts:
  - {id: A5-V-01, verdict: healed-verified in source and jsdom, evidence: "nav-overflow while scrollLeft + clientWidth < scrollWidth - 1, nav-overflow-start while scrollLeft > 1, on load, resize, nav scroll, fonts.ready and after the opener; right-only and left-only fades 0,2,0 and both 0,3,0 (wins), 28 px each; keepInSight returns early only when the link is at least 28 px from both edges. Classes by scrollLeft (box 737, content 779): 0, 0.6, 1 right only; 1.4, 20, 40.6 both; 41, 42 left only. keepInSight: in c3d links 3, 20, 27 px from the left scroll, 28 and 30 do not (c3c: only 3). Centred links clear both fades at every required width; an edge reached by the clamp has its fade off. At the scroll end: 1024 px the visible 41 px of 'Programme' fade in over 28 px; 768 px the 24 px left of 'Decisive questions' lie in the fade; 900 px the 3 px sliver of 'Results' at opacity 0.1 or less. J14 passes.", residual: "page image PIC-22"}
  - {id: "A3-V-03 (a) query gap", verdict: healed-verified in source, evidence: "status.css:674 (max-width: 1079.98px); wide layout from min-width 1080px; uncovered only (1079.98, 1080), unreachable with integer window widths at zoom or scaling steps 0.5, 0.67, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2; print unchanged (152 mm as status-print.css:89)", residual: "none; (width < 1080px) would make the gap exactly zero; PIC-01 as last issued"}
new_attacks:
  - {id: A6-V-01, severity: 4, status: undecided, lens: "visible keyboard focus in the bar (left case new in c3d; right case since the c3c 28 px fade, earlier with the 12% fade below 900 px)", broken_step: "keepInSight runs only when the current section changes, not on focus; the browser's own focus scroll decides where a Tab or Shift+Tab target lands. With nearest-edge alignment (expected in Firefox) a partly hidden link is scrolled flush to the edge it approaches while more links lie beyond it, so its text starts or ends 10 px from the edge at opacity 10/28 = 0.36, about 1.7:1 for a plain link in light (768 px Shift+Tab onto 'Decisive questions' from the end; 1024 px Tab onto 'Terms' leaves 24 px of padding beyond it). Chrome is expected to centre a partly hidden focused element but not to scroll a fully visible link that sits inside a fade band.", minimal_heal: ".nav { scroll-padding-inline: 28px; } so focus and other scroll-into-view operations stop 28 px from either edge; keepInSight's explicit scrollTo is unaffected; also covers part of A1-A1-20.", deciding_evidence: "PIC-23: at 1024 and 768 light, Tab through the bar from the home link to 'Terms', then Shift+Tab back; for each focused link check whether its first or last letters, or its ring, sit in a faded edge; repeat in Firefox if available."}
