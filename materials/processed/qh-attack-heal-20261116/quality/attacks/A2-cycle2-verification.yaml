verdicts:
  - id: C01
    verdict: healed-unverified
    evidence: |-
      inspected (candidate sources, cascade):
      - status-print.css:97 sets .statements, .questions, .failures { display: block; }. The sibling margins at :98, :160
        and :171 are 8pt, 16pt and 14pt.
      - status.css:422 sets @media print { .known > .statements { display: block !important; } }.
      - status.py:721 appends the print sheet after status.css, so equal-specificity rules win by order.
      - No rule of higher specificity sets display on these containers. .question-known .statements sets only gap;
        .section.decisive > .questions sets only max-width and margins.
      Block flow therefore applies to every .statements (principal, example rows, related-statement lists, the decisive
      .question-known), to .questions (frontier and decisive) and to .failures.
      - Spacing: 8pt and 16pt equal the old print gaps. .failures changes from the screen gap of 22px (16.5pt) to 14pt.
        No margins collapse into children: .question has a border and .statement has no vertical margins.
      - Breaks: .statement { break-inside: avoid } is unchanged.
      - Screen: every change sits inside @media print, so the screen cascade is unchanged.
    residual: |-
      Only an approved print route can decide whether content is lost on A4 or Letter; the Chrome evidence is inadmissible.
      In print, .glossary (144 unbreakable entries), .key and .col-defs > dl are still grid containers (A2-A2-07).
