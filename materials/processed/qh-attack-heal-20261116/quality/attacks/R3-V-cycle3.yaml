referee:
  verdict: blocked
  reason: "Valid severity 2-3 entries open in this lens (A3-V-01, -02, -03, -04, -05, -11); A3-V-06 to -10 need the page image; A3-V-01 depends on the atlas. The three assigned heals are verified in source and jsdom with the residuals stated."
  obligations_for_root:
    - "Connect the native Chrome integration; the lead runs PIC-01 to PIC-18 and the inherited checks; no visual acceptance before then."
    - "Atlas lane and content owner: a relation view of the whole programme (A3-V-01); Q24 and PIC-12 on the integrated candidate."
    - "Foundation: A3-V-02, -03, -04, -05, -11 (and -14 if print preview supports two columns). Interaction: the overflow class for A3-V-11, A3-V-12 and A3-V-13."
    - "Rulings: the exemplar for this page (A3-V-10); ownership of status labels and section names (A1-A2-15 / C27); C22."
    - "Content owner: short row and column labels if one-line headers are kept; consistent section headings; the status key explains 'Proposed', which no statement or cell uses; relation data for the atlas."
    - "Screen-reader speech checks for A2-A1-01; real-browser pointer check for A2-A1-04 (PIC-18)."
