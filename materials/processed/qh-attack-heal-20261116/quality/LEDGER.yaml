# Quality lane consolidated attack ledger, cycle 1 (adjudicated before healing).
# Sources: attacks/A1-cycle1.yaml (A1, accessibility and interaction), attacks/A2-cycle1.yaml (A2, links, fidelity,
# safety, print, scale), and the lead's own mechanical runs (lead/results/*). Deduplicated by root cause.
# Evidence classes: tested-chrome = reproduced in headless Chrome 157 by lead/qh-confirm.mjs or lead/qh-cdp.mjs;
# tested-jsdom = attacker's jsdom script; computed; line_reference.
# Status after this cycle's healing is recorded in HEAL-REPORT.md; this file keeps the pre-heal adjudication.
cycle: 1
entries:
  - id: C01
    severity: 2
    status: valid
    sources: [lead]
    owner: foundation (status-print.css, status.css print block)
    claim: Printing shows every statement on A4 and Letter.
    broken_step: >-
      On US Letter, decisive Question 16 (its heading, its open problem and its related statement) is missing from
      the PDF and leaves two thirds of page 29 blank. With other paginations the loss moves: A4 at 10.5 pt base loses 5
      example-row statements, Letter at 11.1 pt loses 6 decisive statements. Relaxing break-after on .known-head
      fixes Letter but moves the loss to A4 and 8.5x10.5 in, so no single break rule is the cause. Printing the grid
      containers .statements, .questions and .failures as block flow loses nothing on any of 18 paginations.
    evidence: >-
      tested-chrome: lead/qh-print-bisect.mjs, 857 reader texts checked per PDF (letters-only comparison of
      pdftotext output). Baseline: Letter missing 2 (s-decisive-hamiltonian-e2, s-decisive-hamiltonian-quartic-constraint),
      7 other sizes missing 0; font-size stress: 10.5pt A4 missing 5, 11.1pt Letter missing 6. Grid-to-block variant:
      0 missing on 8 paper sizes and 8 font-size paginations (one glossary line reordered by the extractor is present).
      Page images: lead/results/cdp-baseline-full/letter-hi-029.png. Results: lead/results/print-bisect/.
    minimal_heal: In print, display .statements, .questions, .failures (and .known > .statements) as block with margins.
  - id: C02
    severity: 2
    status: valid
    sources: [A1-A2-01]
    owner: foundation (compiler/build-quantum-holography-status.py)
    claim: The builder accepts a newer content folder through --input, as its docstring and the README state.
    broken_step: >-
      page.json is always read from the default content folder, never from --input; --audit-dir defaults into the
      default content folder. A newer folder's interface or status labels are silently ignored.
    evidence: line_reference build-quantum-holography-status.py:49,54; to be tested on the mirror (HEAL-REPORT.md).
    minimal_heal: Read page.json from --input when present (fall back to the default with a warning); default the audit folder under --input.
  - id: C03
    severity: 3
    status: valid
    sources: [A1-A2-03]
    owner: foundation (status.py essay())
    claim: Every TeX segment a reader sees becomes MathML.
    broken_step: The essay is html-escaped without the rich-text path; four formulas print as raw TeX (\(c=33\) ...).
    evidence: computed by A2; the lead's Q08 check covered content.json only and missed it (coverage gap, fixed in lead/qh-static.mjs).
    minimal_heal: Render essay blocks with rich(block, terms=False); keep the essay-display test on the raw block.
  - id: C04
    severity: 3
    status: valid
    sources: [A1-A2-05, A1-A1-09, lead AX tree]
    owner: foundation (status.py grid())
    claim: 'Each grid mark is named "<example>, <column>: <status>".'
    broken_step: The 8 marks of the W-algebras row are named "\(W\)-algebras ..." (raw TeX delimiters in the accessible name).
    evidence: tested-chrome Accessibility.queryAXTree (8 button names with TeX); computed by A1 and A2.
    minimal_heal: Build the label from math_free(name); make the audit fail on a backslash in aria-label or title.
  - id: C05
    severity: 3
    status: valid
    sources: [A1-A2-04, A1-A1-10]
    owner: interaction (status.js contentFor)
    claim: The cell card's link names its row as the grid does.
    broken_step: The link text is rowLink.textContent, which includes the MathML annotation, giving "WW-algebras ...".
    evidence: tested-chrome K9 FAIL (cardLink "WW-algebras and quantum Drinfeld–Sokolov reduction").
    minimal_heal: Use textOf(rowLink), which skips annotations.
  - id: C06
    severity: 3
    status: valid
    sources: [A1-A1-05, lead state scenario]
    owner: interaction (status.js applyFilter) and foundation (status.css)
    claim: A status filter tells the reader what it shows, including rows where nothing matches.
    broken_step: >-
      With "Published" pressed, 16 of 20 rows have no matching statement. They close, keep their unfiltered count
      ("15 statements"), and an opened one shows no statements and no notice. The only count is visually hidden.
    evidence: tested-chrome K7 FAIL; lead/results/cdp-baseline-full (state.show, showEmptyRowDetail).
    minimal_heal: A visible filter count line and a visible note in each row the filter empties.
  - id: C07
    severity: 3
    status: valid
    sources: [A1-A2-06, A1-A1-04]
    owner: interaction (status.js)
    claim: A link to a row opens it.
    broken_step: After Close all (or a filter, or closing a statement's row) the hash still names the row; following the same link fires no hashchange and the row stays closed.
    evidence: tested-chrome K4 FAIL (reopenedAfterCloseAll false).
    minimal_heal: On an in-page link click whose fragment equals location.hash, run openTarget after the default action.
  - id: C08
    severity: 3
    status: valid
    sources: [A1-A2-07, lead state scenario]
    owner: interaction (status.js fromAddress)
    claim: A shared address restores a search view.
    broken_step: Unknown ?in= or ?status= values (including stale links and wrong case) give "Nothing on this page matches." with no pressed chip, and stay in the address.
    evidence: tested-chrome K8 FAIL for ?in=bogus, ?status=bogus, ?status=Checked, ?q=koszul&in=bogus.
    minimal_heal: Keep only known scopes and statuses; rewrite the address without the dropped values.
  - id: C09
    severity: 3
    status: valid
    sources: [A1-A2-08]
    owner: interaction (status.js popstate, address timer)
    claim: The address and the page agree after in-page navigation.
    broken_step: >-
      An in-page link followed within 350 ms of typing fires popstate before the address is written; fromURL resets
      the search field to the old address, then the timer writes the discarded query. Result: empty field and results,
      ?q=koszul in the address.
    evidence: 'tested-chrome K5 FAIL (input "", search "?q=koszul"). Part (b) (blob:/content: views) is non_core here (the page is served over https and file://).'
    minimal_heal: Flush the pending address before in-page navigation; on popstate restore only when the search part differs from the last one written or read.
  - id: C10
    severity: 3
    status: valid
    sources: [A1-A1-01]
    owner: interaction (status.js Escape)
    claim: Dismissing a card with Escape does not move keyboard focus (WCAG 1.4.13).
    broken_step: Escape always focuses the card's owner; with a hover card open, focus jumps from a chip or from the search field to the hovered term.
    evidence: tested-chrome K1 FAIL (focus moved to button.term "local vacuum" in both cases).
    minimal_heal: Return focus to the owner only when focus is inside the card or nowhere.
  - id: C11
    severity: 3
    status: valid
    sources: [A1-A1-02]
    owner: interaction (status.js focusout)
    claim: The card describes the control that has focus; aria-expanded is true only on its owner.
    broken_step: A pinned card stays open after focus leaves its owner (column-head cards have no link); the next column head is described by the old card and the old head stays aria-expanded=true.
    evidence: tested-chrome K2 FAIL.
    minimal_heal: When focus leaves a pinned owner for anything outside the card, hide the card.
  - id: C12
    severity: 3
    status: valid
    sources: [A1-A1-03]
    owner: interaction (status.js search keydown)
    claim: Down moves from the search field into the results.
    broken_step: Down within 90 ms of typing focuses a result of the previous query; the debounced run then removes it and focus falls to body.
    evidence: tested-chrome K3 FAIL (activeElement body).
    minimal_heal: Run the pending query before moving focus.
  - id: C13
    severity: 3
    status: valid
    sources: [A1-A1-06]
    owner: interaction (status.js index)
    claim: "\"Nothing on this page matches.\" is true when shown."
    broken_step: The lead, the status key and the section introductions are not indexed; words visible only there report nothing.
    evidence: tested-chrome K10 FAIL ("comultiplication", "status marks", "strongest status").
    minimal_heal: Index the lead, the key items and each section introduction.
  - id: C14
    severity: 3
    status: valid
    sources: [A1-A1-07]
    owner: interaction (status.js) with a bar control from foundation (status.py)
    claim: Character-key shortcuts meet WCAG 2.1.4 (Level A).
    broken_step: A bare '/' anywhere outside text fields moves focus to the search; it cannot be turned off or remapped.
    evidence: tested-chrome K11 FAIL (focus moved from a filter chip to input#find-q).
    minimal_heal: Remove the bare '/' binding and give the search a visible opener in the bar (status.js already supports [data-find-open]).
  - id: C15
    severity: 3
    status: valid
    sources: [A1-A1-08, lead contrast scenario]
    owner: foundation (status.css tokens)
    claim: Status marks meet 3:1 non-text contrast (WCAG 1.4.11).
    broken_step: "\"Not yet formulated\" (a dash; 22 grid cells): light #9b958d is 2.85:1 on paper, 2.61 on a hovered row, 2.46 in the selected cell; dark #77716a is 2.78 in the selected cell."
    evidence: tested-chrome contrast scenario (mark-not-posed 2.85 light); computed by A1.
    minimal_heal: --st-not-posed #857f77 in both themes (print value already passes).
  - id: C16
    severity: 3
    status: valid
    sources: [A1-A1-11]
    owner: interaction (status.js) / foundation (status.css)
    claim: Focus is never hidden (WCAG 2.4.7 in practice; 2.4.11 in 2.2).
    broken_step: With the grid scrolled sideways, a mark reached by Left, Home, Shift+Tab sits under the sticky row header.
    evidence: tested-chrome K6 FAIL (covered steps 2-4 of 7 at 1024, 768, 480, 375; overlap up to 228 px).
    minimal_heal: On focus inside the grid, scroll so that the focused control clears its row header.
  - id: C17
    severity: 3
    status: valid
    sources: [A1-A2-02 (1)-(5)]
    owner: foundation (audit.py)
    claim: The build audit enforces the public-safety rules for reader-visible text.
    broken_step: Words fuse across tags (no \b), attribute values, ids, mtext and the head are not scanned, and process tokens (wave/phase/session numbers, swarm, attack-heal, lane ids, percentages) are absent from the list.
    evidence: A2's synthetic fixtures (tested against audit.py); to be re-run against the healed audit (lead/qh-audit-fixtures.py).
    minimal_heal: Tag-boundary spacing; scan attributes, ids, mtext/annotation and head; add unambiguous process patterns as failures and ambiguous words (adopted, draft) as warnings.
  - id: C18
    severity: 3
    status: valid
    sources: [A1-A2-09]
    owner: content owner (ids) and foundation (audit warning)
    claim: A reader can link to any statement.
    broken_step: 98 of 281 statements have no content id and therefore no anchor (81 of 109 example statements).
    evidence: computed by A2; lead Q09 counts 98 statements without anchor.
    minimal_heal: Content owner adds ids; audit warns and lists anchorless statements. Not healable by design alone.
  - id: C19
    severity: 3
    status: valid
    sources: [A1-A2-10]
    owner: foundation (status.py, README) and content owner (ids)
    claim: Shared anchors survive retitling.
    broken_step: Open-group anchors come from headings (no id field exists); glossary anchors from term text.
    evidence: line_reference status.py:145-150, 622.
    minimal_heal: Optional "id" on open groups and glossary entries, used when present; current anchors unchanged without ids.
  - id: C20
    severity: 3
    status: undecided
    sources: [A1-A2-11, lead safety scan]
    owner: content owner (via root)
    claim: Reader text carries no process language.
    broken_step: >-
      Essay: "retains the adopted local theorem above charge one"; statement s-decisive-critical-existing-order:
      "remains a saved constructor certificate", "uses a recorded exact kernel certificate", "the stored matrix
      arithmetic has not been independently replayed". Whether these are mathematical qualifications or workflow
      residue is the content owner's decision. Until ruled, the external gate (process-language scan) is not closed.
    evidence: computed (lead Q04 review hits; A2 scan).
    minimal_heal: Content owner ruling and, if needed, rewording.
  - id: C21
    severity: 3
    status: undecided
    sources: [A1-A2-12]
    owner: atlas lane and root (DESIGN-CONTRACT.json)
    claim: Atlas relation fidelity can be checked mechanically.
    broken_step: No public binding from an edge to its source edge, no relation vocabulary, no definition of a dependency-path step, no map from page statuses to atlas status codes, sourceLabel not limited to public references, and example values that would fail the audit.
    evidence: missing_source (DESIGN-CONTRACT.json); CONTRACT.json atlas_testability_requirements states the hooks quality will test.
    minimal_heal: Contract revision (manifest format, relation enum, step rule, status map, public-only sourceLabel).
  - id: C22
    severity: 3
    status: undecided
    sources: [A1-A2-13]
    owner: root ruling
    claim: Status presentation implies no theorem count (DESIGN-CONTRACT readerRules[1]).
    broken_step: The cover tally and every row/question mix show counts by status (197 / 74 / 6 / 4); the rule's scope (atlas only or whole page) is unstated.
    evidence: computed.
    minimal_heal: A ruling on the rule's scope.
  - id: C23
    severity: 3
    status: undecided
    sources: [A1-A1-12]
    owner: interaction (status.js card) and foundation (status.css sheet)
    claim: On a phone the card can be read and closed.
    broken_step: >-
      In Chrome touch emulation the sheet opens, does not cover its trigger in the tested case, and closes by a tap
      elsewhere and by Escape. It has no close control, ignores the bottom safe area, and dismissal by tapping
      non-interactive text relies on click reaching document, which iOS Safari is known to withhold.
    evidence: tested-chrome K12 (closeControl false; closedByTapElsewhere true); iOS untested.
    minimal_heal: A labelled close button in the card; bottom offset with env(safe-area-inset-bottom). iOS verification remains.
  - id: C24
    severity: 4
    status: valid
    sources: [A1-A1-14, lead AX tree]
    owner: foundation (status.py)
    claim: Headings give the page's structure.
    broken_step: Example-row and counterexample statements are h4 directly under an h2.
    minimal_heal: heading='h3' for row and counterexample statements.
  - id: C25
    severity: 4
    status: valid
    sources: [A1-A2-17]
    owner: foundation (audit.py)
    claim: The audit scales with content.
    broken_step: The duplicate-id check is quadratic.
    minimal_heal: One Counter over one findall.
  - id: C26
    severity: 4
    status: valid
    sources: [A1-A1-13, A1-A1-15, A1-A1-16, A1-A1-17, A1-A1-18, A1-A1-19, A1-A2-14, A1-A2-16, A1-A2-18, A1-A2-19, lead L-07 (grid scrolls at 1024 px), A1-A2-02(6) (CSS/JS comments name producer files)]
    owner: interaction / foundation
    claim: Optional improvements outside the acceptance contract.
    minimal_heal: See the source entries; not healed in this cycle.
  - id: C27
    severity: 4
    status: undecided
    sources: [A1-A1-20, A1-A1-21, A1-A1-22, A1-A2-15]
    owner: foundation / interaction / root
    claim: Focus-ring clipping in the bar, forced-colours pressed states, hover grace period, status-label ownership.
    minimal_heal: See the source entries; need rendering or a ruling.
  - id: X01
    severity: 3
    status: invalid
    sources: [lead contrast scenario]
    claim: The tally pills and the theme button fail non-text contrast (borders 1.37:1 light, 1.54:1 dark).
    refutation: WCAG 1.4.11 requires 3:1 for the visual information needed to identify a component; these controls are identified by their text (tally) and by a 7:1 icon (theme), so the border is not that information.
  - id: X02
    severity: 3
    status: invalid
    sources: [lead state scenario]
    claim: History Forward to a search result does not bring the result back into view.
    refutation: Timing artifact. With default motion the restoration is smooth and completes after about 2 s (lead/results/history/history-baseline.json forward3s inView true); with reduced motion it is immediate.
  - id: X03
    severity: 2
    status: invalid
    sources: [lead first keyboard and deep-link runs]
    claim: Focus stops are off screen or under the bar; in-page hash changes fail to show their targets.
    refutation: Measured during smooth scrolling and after an unreliable reset. With settled measurements (450 ms per stop, hit-testing) 140 Tab stops and 24 Shift+Tab stops at 1400 and 375 px have a visible ring and none is covered; all 15 hash changes and 30 arrivals show their targets (lead/results/cdp-baseline-r2).

