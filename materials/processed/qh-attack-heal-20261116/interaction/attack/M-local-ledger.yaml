- id: A1-M-01
  severity: 3
  status: valid
  lens: empty state / filter
  target: baseline-src/status.js:349-369 applyFilter; status.css (no rule for [data-filter-empty])
  claim: The Show filter states what it leaves out.
  broken_step: After choosing a status, rows without such a statement are closed and get data-filter-empty, which no CSS or text uses; the only count is a visually hidden live region. A sighted reader sees 17 closed rows that look like the 3 open ones; opening one shows its summary and no statements, with no explanation.
  evidence_type: failing_test
  evidence_ref: "node scratch/probe-filter.cjs baseline-build/baseline-nofonts.html -> after Conditional: visible statements in rows 3, open rows 3, filter-empty rows 17, live text 'Showing 3 of 109 statements, in 3 of 20 examples.', live class visually-hidden"
  files_read: [baseline-src/status.js, baseline-src/status.css]
  tools_used: [jsdom 28.1.0]
  confidence: high
  blast_radius: hidden required content while a filter is on; readers can conclude an example has no statements
  minimal_heal: status.js shows a visible count line with a Show-all control, and a per-row note with the same control in filter-empty rows; CSS proposal for both
  residual: styling belongs to the foundation
  deciding_evidence: jsdom test that a filter-empty row shows a visible note and that the control restores all statements
