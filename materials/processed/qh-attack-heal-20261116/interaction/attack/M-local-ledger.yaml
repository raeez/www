  evidence_ref: "status.js:346 all('.filter[data-filter]').filter(not .find); :313 all('[data-expand]'); :540 all('main .statement'); foundation CONTRACT.json plans section#atlas[data-atlas-mount] inside main"
  files_read: [baseline-src/status.js, foundation CONTRACT.json]
