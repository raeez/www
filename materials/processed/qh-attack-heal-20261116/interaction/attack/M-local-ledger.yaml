  blast_radius: cross-component state corruption once the atlas lands
  minimal_heal: exclude [data-atlas-mount] subtrees from page-level binding and indexing; qh:navigate, qh:state, qh:unknown-anchor events
  residual: the atlas module does not exist yet; its conformance is the atlas owner's
  deciding_evidence: jsdom test with a mock mount
