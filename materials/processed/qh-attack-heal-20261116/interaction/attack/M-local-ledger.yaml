- id: A1-M-07
  severity: 3
  status: valid
  lens: large-page cost
  target: baseline-src/status.js:1000-1013 markScrollers (first animation frame and fonts.ready)
  claim: The script adds little to start-up and does not prevent the page from skipping off-screen rendering.
  broken_step: The first-frame pass reads scrollWidth/clientWidth of all 316 formula boxes, forcing a full layout before first paint. Measured in headless Chrome 157 (3 samples each, 1400x900, no fonts) - start-up long task with the pass 122/134/208 ms, without it 95/104/104 ms. With content-visibility:auto on the sections the long task stays 131-139 ms while the pass runs and drops to 98-99 ms without it, so the eager pass also cancels any off-screen skipping the stylesheet could add.
  evidence_type: other
  evidence_ref: measure/cv-baseline.json (node tools/cv-experiment.mjs baseline-build/baseline-nofonts.html chrome-profile)
  files_read: [baseline-src/status.js]
  tools_used: [headless Chrome via tools/chrome.mjs]
  confidence: medium
  blast_radius: grows with content (larger content and an atlas add boxes and layout)
  minimal_heal: measure each box when it comes within 400px of the viewport (IntersectionObserver), re-measure near boxes on resize and font load; full pass only where IntersectionObserver is absent
  residual: the remaining ~100 ms is parsing and style of a 1.8 MB document, outside the script
  deciding_evidence: candidate measurement with and without content-visibility
  evidence_status: "Chrome measurement obtained through raw CDP before the binding browser restriction reached this lane; preserved, not accepted evidence (RESTRICTION-BROWSER.md). Acceptance rests on jsdom and structural evidence."
