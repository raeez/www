<figure class="qh-fig qv" id="fig-energy-two-exchange" data-figure="fig-energy-two-exchange" data-qh-figure="fig-energy-two-exchange" data-figure-type="authored_drawing" data-figure-chapter="ch01" data-figure-section="ch01-two-preparations" aria-labelledby="fig-energy-two-exchange-title">
<div class="qh-fig-head"><p class="qh-fig-title" id="fig-energy-two-exchange-title" data-block-title>The states of energy two and the operations which join them</p></div>
<p class="qv-sr">A grid shows the states of two harmonics. The horizontal coordinate is the number of quanta in the first harmonic, from zero to four. The vertical coordinate is the number of quanta in the second harmonic, from zero to two. The state a, with two quanta in the first harmonic, and the state b, with one quantum in the second, lie on the line of energy two. An operation on the first harmonic alone moves a state along its row, and an operation on the second alone moves it along its column, so neither carries a to b. Removing one quantum of the second harmonic and adding two to the first carries b, through the state with no quanta, to twice a. Removing two quanta of the first harmonic and adding one to the second carries a, through the state with no quanta, to twice b.</p>

<p class="qv-say" data-layer="1">\(J_2\) removes the quantum of the second harmonic, with the factor \(2\). Two applications of \(J_{-1}\) then add two quanta to the first harmonic. The state \(b\) is carried through the state with no quanta to \(2a\).</p>
<p class="qv-say" data-layer="2">Two applications of \(J_1\) remove the quanta of the first harmonic, with the factors \(2\) and \(1\). Then \(J_{-2}\) adds one quantum to the second harmonic. The state \(a\) is carried through the state with no quanta to \(2b\).</p>
<p class="qv-say" data-layer="3">An operation on the first harmonic alone leaves the number of quanta in the second harmonic unchanged. It moves \(a\) within the lowest row and \(b\) within the middle row. It cannot carry one to the other.</p>
<p class="qv-say" data-layer="4">An operation on the second harmonic alone leaves the number of quanta in the first harmonic unchanged. It moves \(a\) within its column and \(b\) within its column. It cannot carry one to the other.</p>

<figcaption class="qh-fig-caption">Each dot is a state \(p_1^{m_1}p_2^{m_2}\), with \(m_1\) quanta in the first harmonic and \(m_2\) in the second. The ringed states \(a\) and \(b\) are the two states of energy two. An operation on one harmonic alone cannot join them. Each of the two products of three modes joins them by passing through the state with no quanta, and their sum \(O\) exchanges \(a\) and \(b\) with the factor \(2\).</figcaption>
