<figure class="qh-fig qv" id="fig-front-routes" aria-labelledby="fig-front-routes-title">
<div class="qh-fig-head"><p class="qh-fig-title" id="fig-front-routes-title">Comparing the products of three and of four fields</p></div>
<p class="qv-sr">With three fields a, b and c there are two products, (ab)c and a(bc), and one homotopy h joins them. With four fields there are five products, joined by five homotopies in a pentagon. From ((ab)c)d to a(b(cd)) one route passes through (ab)(cd) and uses two homotopies. The other route passes through (a(bc))d and a((bc)d) and uses three. A further homotopy, an operation on four fields, fills the pentagon between the two routes.</p>

<figcaption class="qh-fig-caption">In the small pictures the ringed pair of fields is brought together first. Write \(h(a,b,c)\) for the homotopy between the two products of three fields, so that \(d\,h(a,b,c)=(ab)c-a(bc)\) when \(d\) kills \(a\), \(b\) and \(c\). With four fields each edge of the pentagon is one such homotopy, with a product of two fields as one of its inputs or with a fourth field multiplied on. Edges 1 and 2 form one route between the extreme products, and edges 3, 4 and 5 form the other. The shaded face is the further homotopy, an operation on four fields, which compares the two routes.</figcaption>
