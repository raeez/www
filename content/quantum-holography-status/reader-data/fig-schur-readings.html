<figure class="qh-fig qv" id="fig-schur-readings" data-figure="fig-schur-readings" data-qh-figure="fig-schur-readings" data-figure-type="authored_drawing" data-figure-chapter="ch11" data-figure-section="ch11-cubic-observable" aria-labelledby="fig-schur-readings-title">
<div class="qh-fig-head"><p class="qh-fig-title" id="fig-schur-readings-title" data-block-title>Which fermion states have the same cubic reading?</p></div>
<p class="qv-sr">In each Young diagram, sum column minus row over its boxes to obtain the eigenvalue of the cubic operator W on that state. The two grade-two diagrams give +1 and −1. At grade three the readings are 3, 0 and −3. At grade six the shapes (4,1,1) and (3,3) both give 3. Their shifted third momentum moments are 117/2 and 45/2. Each strip marks the filled fermion levels relative to the middle of the ground-state gap.</p>
<p class="qv-note">Each filled circle is an occupied momentum. Neighbouring circles are one step apart. The vertical mark is zero, halfway between the levels at \(-1/2\) and \(1/2\). In the diagram of each state, add the box entries to get its eigenvalue for the cubic operator \(W\). Each entry is its column number minus its row number.</p>
<p class="qv-group-h">The ground state and the two states of two quanta</p>
<ul class="qv-items">
<li class="qv-item">
<p class="qv-item-h">The ground state \(1\)</p>
<svg class="qv-svg qv-strip" viewBox="0 0 222 58" style="--qv-w:222" aria-hidden="true" focusable="false"><path class="qv-axis" d="M111 14V42"/><g class="qv-full"><circle cx="20" cy="28" r="7"/><circle cx="46" cy="28" r="7"/><circle cx="72" cy="28" r="7"/><circle cx="98" cy="28" r="7"/></g><g class="qv-empty"><circle cx="124" cy="28" r="7"/><circle cx="150" cy="28" r="7"/><circle cx="176" cy="28" r="7"/><circle cx="202" cy="28" r="7"/></g><g class="qv-n" text-anchor="middle" style="font-size:23px"><text x="20" y="54">−7/2</text><text x="111" y="54">0</text><text x="202" y="54">7/2</text></g></svg>
<p class="qv-note">Every negative momentum shown is filled in this upper-edge window for odd \(N\ge5\). The finite ground state occupies the half-integers from \(\tfrac12-N\) to \(-\tfrac12\). Its excitation energy and all the displayed moment differences are zero.</p>
</li>
<li class="qv-item">
<p class="qv-item-h">\(u_+=s_{(2)}=(p_1^2+p_2)/2\)</p>
<span class="qv-yd" style="font-size:calc(var(--text-sm) * 1.28)" role="img" aria-label="One row of two boxes"><span class="qv-yr"><span>0</span><span>1</span></span></span>
<svg class="qv-svg qv-strip" viewBox="0 0 222 58" style="--qv-w:222" aria-hidden="true" focusable="false"><path class="qv-axis" d="M111 14V42"/><path class="qv-go" d="M98 18Q124 0 150 18"/><path class="qv-head-go" d="M0 0l-8 -3.6v7.2z" transform="translate(150 18) rotate(34.7)"/><g class="qv-full"><circle cx="20" cy="28" r="7"/><circle cx="46" cy="28" r="7"/><circle cx="72" cy="28" r="7"/><circle cx="150" cy="28" r="7"/></g><g class="qv-empty"><circle cx="98" cy="28" r="7"/><circle cx="124" cy="28" r="7"/><circle cx="176" cy="28" r="7"/><circle cx="202" cy="28" r="7"/></g><g class="qv-n" text-anchor="middle" style="font-size:23px"><text x="20" y="54">−7/2</text><text x="111" y="54">0</text><text x="202" y="54">7/2</text></g></svg>
<p class="qv-note">Reading \(0+1=1\). One fermion is raised from \(-\tfrac12\) to \(\tfrac32\).</p>
</li>
<li class="qv-item">
<p class="qv-item-h">\(u_-=s_{(1,1)}=(p_1^2-p_2)/2\)</p>
<span class="qv-yd" style="font-size:calc(var(--text-sm) * 1.28)" role="img" aria-label="One column of two boxes"><span class="qv-yr"><span>0</span></span><span class="qv-yr"><span>−1</span></span></span>
<svg class="qv-svg qv-strip" viewBox="0 0 222 58" style="--qv-w:222" aria-hidden="true" focusable="false"><path class="qv-axis" d="M111 14V42"/><path class="qv-go" d="M72 18Q98 0 124 18"/><path class="qv-head-go" d="M0 0l-8 -3.6v7.2z" transform="translate(124 18) rotate(34.7)"/><g class="qv-full"><circle cx="20" cy="28" r="7"/><circle cx="46" cy="28" r="7"/><circle cx="98" cy="28" r="7"/><circle cx="124" cy="28" r="7"/></g><g class="qv-empty"><circle cx="72" cy="28" r="7"/><circle cx="150" cy="28" r="7"/><circle cx="176" cy="28" r="7"/><circle cx="202" cy="28" r="7"/></g><g class="qv-n" text-anchor="middle" style="font-size:23px"><text x="20" y="54">−7/2</text><text x="111" y="54">0</text><text x="202" y="54">7/2</text></g></svg>
<p class="qv-note">Reading \(0-1=-1\). One fermion is raised from \(-\tfrac32\) to \(\tfrac12\).</p>
</li>
</ul>
<p class="qv-group-h">The three states of three quanta</p>
<ul class="qv-items">
<li class="qv-item">
<p class="qv-item-h">\(s_{(3)}=(p_1^3+3p_1p_2+2p_3)/6\)</p>
<span class="qv-yd" style="font-size:calc(var(--text-sm) * 1.28)" role="img" aria-label="One row of three boxes"><span class="qv-yr"><span>0</span><span>1</span><span>2</span></span></span>
<p class="qv-note">Reading \(3\). Energy on the ring \(\varepsilon_1(3+6/N)\).</p>
</li>
<li class="qv-item">
<p class="qv-item-h">\(s_{(2,1)}=(p_1^3-p_3)/3\)</p>
<span class="qv-yd" style="font-size:calc(var(--text-sm) * 1.28)" role="img" aria-label="Rows of two boxes and one box"><span class="qv-yr"><span>0</span><span>1</span></span><span class="qv-yr"><span>−1</span></span></span>
<p class="qv-note">Reading \(0\). Energy on the ring \(3\varepsilon_1\).</p>
</li>
<li class="qv-item">
<p class="qv-item-h">\(s_{(1,1,1)}=(p_1^3-3p_1p_2+2p_3)/6\)</p>
<span class="qv-yd" style="font-size:calc(var(--text-sm) * 1.28)" role="img" aria-label="One column of three boxes"><span class="qv-yr"><span>0</span></span><span class="qv-yr"><span>−1</span></span><span class="qv-yr"><span>−2</span></span></span>
<p class="qv-note">Reading \(-3\). Energy on the ring \(\varepsilon_1(3-6/N)\).</p>
</li>
</ul>
<p class="qv-group-h">Two states of six quanta with the same reading</p>
<ul class="qv-items">
<li class="qv-item">
<p class="qv-item-h">\(s_{(4,1,1)}\)</p>
<span class="qv-yd" style="font-size:calc(var(--text-sm) * 1.28)" role="img" aria-label="Rows of four, one and one boxes, with total content three"><span class="qv-yr"><span>0</span><span>1</span><span>2</span><span>3</span></span><span class="qv-yr"><span>−1</span></span><span class="qv-yr"><span>−2</span></span></span>
<svg class="qv-svg qv-strip" viewBox="0 0 222 58" style="--qv-w:222" aria-hidden="true" focusable="false"><path class="qv-axis" d="M111 14V42"/><path class="qv-go" d="M46 18Q124 -14 202 18"/><path class="qv-head-go" d="M0 0l-8 -3.6v7.2z" transform="translate(202 18) rotate(22.3)"/><g class="qv-full"><circle cx="20" cy="28" r="7"/><circle cx="72" cy="28" r="7"/><circle cx="98" cy="28" r="7"/><circle cx="202" cy="28" r="7"/></g><g class="qv-empty"><circle cx="46" cy="28" r="7"/><circle cx="124" cy="28" r="7"/><circle cx="150" cy="28" r="7"/><circle cx="176" cy="28" r="7"/></g><g class="qv-n" text-anchor="middle" style="font-size:23px"><text x="20" y="54">−7/2</text><text x="111" y="54">0</text><text x="202" y="54">7/2</text></g></svg>
<p class="qv-note">Reading \(0+1+2+3-1-2=3\). One fermion is raised from \(-\tfrac52\) to \(\tfrac72\), and \(M_3=\tfrac{117}2\).</p>
</li>
<li class="qv-item">
<p class="qv-item-h">\(s_{(3,3)}\)</p>
<span class="qv-yd" style="font-size:calc(var(--text-sm) * 1.28)" role="img" aria-label="Two rows of three boxes, with total content three"><span class="qv-yr"><span>0</span><span>1</span><span>2</span></span><span class="qv-yr"><span>−1</span><span>0</span><span>1</span></span></span>
<svg class="qv-svg qv-strip" viewBox="0 0 222 58" style="--qv-w:222" aria-hidden="true" focusable="false"><path class="qv-axis" d="M111 14V42"/><path class="qv-go" d="M72 18Q111 -4 150 18"/><path class="qv-head-go" d="M0 0l-8 -3.6v7.2z" transform="translate(150 18) rotate(29.4)"/><path class="qv-go" d="M98 18Q137 -4 176 18"/><path class="qv-head-go" d="M0 0l-8 -3.6v7.2z" transform="translate(176 18) rotate(29.4)"/><g class="qv-full"><circle cx="20" cy="28" r="7"/><circle cx="46" cy="28" r="7"/><circle cx="150" cy="28" r="7"/><circle cx="176" cy="28" r="7"/></g><g class="qv-empty"><circle cx="72" cy="28" r="7"/><circle cx="98" cy="28" r="7"/><circle cx="124" cy="28" r="7"/><circle cx="202" cy="28" r="7"/></g><g class="qv-n" text-anchor="middle" style="font-size:23px"><text x="20" y="54">−7/2</text><text x="111" y="54">0</text><text x="202" y="54">7/2</text></g></svg>
<p class="qv-note">Reading \(0+1+2-1+0+1=3\). The occupied levels \(-3/2,-1/2\) move to \(3/2,5/2\), respectively, and \(M_3=\tfrac{45}2\).</p>
</li>
</ul>
<figcaption class="qh-fig-caption">The eigenvalue of the cubic current observable \(W\) on \(s_\lambda\) is the sum of column minus row over its boxes. In the free spinless ring, one momentum step is \(2\pi\hbar/L\) for circumference \(L\). The strips use this unit and put zero midway between the highest filled and lowest empty levels of the ground state. Each arrow goes from a vacated level to an occupied one. At six units of added momentum the two displayed states have the same cubic reading \(W=3\), and hence the same free-ring kinetic energy. Subtracting the ground-state sum of cubed momenta from the excited-state sum gives \(M_3=117/2\) and \(45/2\), respectively, in these shifted units. <a href="#eq-cut-and-join">The cubic operator</a> · <a href="#eq-momentum-moments">The shifted moments</a></figcaption>
</figure>
