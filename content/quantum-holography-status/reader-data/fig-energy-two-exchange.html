<div class="qh-fig-head"><p class="qh-fig-title" id="fig-energy-two-exchange-title" data-block-title>Two paths between the occupations of energy two</p></div>
<p class="qv-sr">The horizontal axis counts first-harmonic quanta from zero to four. The vertical axis counts second-harmonic quanta from zero to two. On the energy-two line, a is at (2,0) and b is at (0,1). A first-harmonic operation keeps the row fixed and a second-harmonic operation keeps the column fixed. The arrows for the joint conversion run from b through (0,0) to twice a. The reverse path runs from a through (0,0) to twice b.</p>

<p class="qv-say" data-layer="1">Read the arrows as \(J_2,J_{-1},J_{-1}\). On monomials they give \(p_2\to2\to2p_1\to2p_1^2\). Divide every vector by \(\sqrt2\) to follow the unit input \(b\) to \(2a\).</p>
<p class="qv-say" data-layer="2">In the reverse direction the arrows are \(J_1,J_1,J_{-2}\). They give \(p_1^2\to2p_1\to2\to2p_2\). Dividing by \(\sqrt2\) sends the unit input \(a\) to \(2b\).</p>
<p class="qv-say" data-layer="3">An operator on the first harmonic preserves the second count. Starting at \(a\) it can produce a superposition only in row zero. Starting at \(b\) it stays in row one.</p>
<p class="qv-say" data-layer="4">An operator on the second harmonic preserves the first count. The image of \(a\) stays in column two and the image of \(b\) stays in column zero.</p>

<figcaption class="qh-fig-caption">Each dot gives the two occupation counts. The circled dots represent \(a=p_1^2/\sqrt2\) and \(b=p_2/\sqrt2\). Each path through the origin converts one into twice the other. Their sum \(O\) has the normalized sum and difference as eigenstates, with readings \(+2\) and \(-2\). The observable \(S=O/2\) reads the sign. <a href="#eq-energy-two-exchange">The mode calculation</a> · <a href="#eq-disk-reading">The equal means of \(C\) and \(O\)</a> · <a href="#eq-ring-energy">The energy splitting on the ring</a></figcaption>
